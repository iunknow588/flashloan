[workspace]
resolver = "2"
members = [
    "manager_contracts",
    "manager_db",
    "manager_api",
    "token_manager",
    "pool_manager",
    "candidate_edge_pool_manager",
    "candidate_exchange_pool_manager",
    "closed_loop_manager",
    "review_manager",
    "broadcast_manager",
    "composite_manager",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
# `uniswap-v4-sdk` requires Rust 1.91 or newer. The toolchain in this
# repository is pinned well above that floor.
rust-version = "1.91"

[workspace.dependencies]
alloy-primitives = { version = "1", default-features = false, features = ["std"] }
# The Uniswap V4 SDK's `extensions` feature is built on the `alloy` provider
# stack, so the provider is declared here as well. The pool manager uses it
# for the SDK's `PoolManagerLens`, which is the reference implementation of
# the tick storage layout.
alloy = { version = "2", default-features = false, features = ["provider-http", "reqwest-rustls-tls", "rpc-types"] }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
# Uniswap V4 SDK. The pure AMM math is consumed (`swap_math`,
# `sqrt_price_math`, `full_math`) and the `extensions` feature provides the
# `PoolManagerLens` and `SimpleTickDataProvider`, which are the reference
# implementations of the tick storage layout and of the tick traversal.
uniswap-v4-sdk = { version = "2", default-features = false, features = ["extensions", "std"] }
