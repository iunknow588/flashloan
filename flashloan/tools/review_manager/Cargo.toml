[package]
name = "review-manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "review_manager"
path = "src/lib.rs"

[dependencies]
alloy-primitives.workspace = true
chrono.workspace = true
closed-loop-manager = { path = "../closed_loop_manager" }
hex.workspace = true
manager-contracts = { path = "../manager_contracts" }
pool-manager = { path = "../pool_manager" }
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiny-keccak.workspace = true
# The record layer needs the async filesystem, the bounded channel and the
# timer.  Only *features* are added here: the dependency edge already exists,
# so `Cargo.lock` stays byte-identical (guard `G-4`).
tokio = { workspace = true, features = ["fs", "sync", "time"] }

[dev-dependencies]
manager-db = { path = "../manager_db" }
tempfile.workspace = true
