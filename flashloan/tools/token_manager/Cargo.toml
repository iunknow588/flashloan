[package]
name = "token-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "token_manager"
path = "src/lib.rs"

[[bin]]
name = "token-manager"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
hex.workspace = true
manager-contracts = { path = "../manager_contracts" }
manager-db = { path = "../manager_db" }
rusqlite = { workspace = true, features = ["bundled", "serde_json"] }
serde.workspace = true
serde_json = "1"
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
