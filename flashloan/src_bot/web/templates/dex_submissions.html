<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提交记录</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 28px; }
    header { display: flex; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1480px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    button { min-height: 34px; border: 1px solid #0f766e; border-radius: 6px; padding: 0 12px; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; }
    button.copy-btn { min-height: 28px; border-color: #d0d5dd; background: #fff; color: #344054; font-size: 12px; }
    button.danger { border-color: #b42318; background: #b42318; }
    button:disabled { opacity: .55; cursor: wait; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric, .panel { border: 1px solid #d9dee7; border-radius: 8px; background: #fff; padding: 14px; }
    .metric small { display: block; color: #667085; margin-bottom: 7px; }
    .metric strong { display: block; font-size: 18px; }
    .muted, .metric span { color: #667085; font-size: 13px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #e4e7ec; padding: 8px; text-align: right; white-space: nowrap; vertical-align: top; }
    th:first-child, td:first-child, th:nth-child(3), td:nth-child(3), th:nth-child(8), td:nth-child(8) { text-align: left; }
    td.route-cell { min-width: 300px; max-width: 460px; white-space: normal; line-height: 1.45; }
    .route-addresses { margin-top: 4px; font-family: Consolas, "Courier New", monospace; word-break: break-all; }
    td.reason { max-width: 360px; white-space: normal; line-height: 1.45; }
    .badge { display: inline-flex; align-items: center; min-height: 22px; border-radius: 999px; padding: 2px 8px; font-weight: 700; background: #eef2f6; color: #344054; }
    .badge.live { background: #dcfae6; color: #067647; }
    .badge.static { background: #fff3cd; color: #8a6116; }
    .badge.fail { background: #fee4e2; color: #b42318; }
    @media (max-width: 860px) { header { display: block; } nav { margin-top: 10px; } main, header { padding-left: 18px; padding-right: 18px; } }
  </style>
</head>
<body data-dex-surface-template="submissions">
  <header>
    <h1>提交记录</h1>
    <nav>
      <a data-surface-link href="/dex">报价与路由</a>
      <a data-surface-link href="/dex/overview">DEX 总览</a>
      <a data-surface-link href="/dex/market-observation">市场观察</a>
      <a data-surface-link href="/dex/candidates">候选池</a>
      <a data-surface-link href="/dex/submissions">提交记录</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="refreshBtn">刷新记录</button>
      <button id="clearBtn" class="danger">清空当前链路记录</button>
      <span id="message" class="muted">等待数据</span>
    </div>
    <section class="grid">
      <div class="metric"><small>提交/观察总数</small><strong id="attemptCount">-</strong><span id="source">-</span></div>
      <div class="metric"><small>成功</small><strong id="successCount">-</strong><span>已完成交易</span></div>
      <div class="metric"><small>失败</small><strong id="failedCount">-</strong><span>执行或链上失败</span></div>
      <div class="metric"><small>阻断</small><strong id="blockedCount">-</strong><span>报价后未满足提交条件</span></div>
    </section>
    <section class="panel">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>网络</th>
              <th>路径</th>
              <th>证据来源</th>
              <th>链上区块</th>
              <th>观察/复核盈亏比例</th>
              <th>状态</th>
              <th>原因与复盘要点</th>
              <th>订单/交易</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let latestRows = [];
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const fmtTime = value => value ? new Date(value).toLocaleString("zh-CN", {hour12: false}) : "-";
    const apiPath = path => {
      const scoped = window.ChainSelector?.withSelection ? window.ChainSelector.withSelection(path) : path;
      const url = new URL(scoped, window.location.origin);
      url.searchParams.delete("protocols");
      return url.pathname + (url.search ? url.search : "");
    };
    async function fetchJson(path) {
      const response = await fetch(apiPath(path), {cache: "no-cache", headers: {"Accept": "application/json"}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    async function postJson(path) {
      const response = await fetch(apiPath(path), {method: "POST", cache: "no-cache", headers: {"Accept": "application/json"}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function numberValue(value) {
      if (value === null || value === undefined || value === "") return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    }
    function evidence(row) {
      return row.review_summary?.onchain_evidence || row.quote?.live_onchain_evidence || {};
    }
    function routeIdentity(row) {
      const ev = evidence(row);
      return ev.routeIdentity || ev.route_identity || row.review_summary?.route_identity || {};
    }
    function shortAddress(value) {
      const text = String(value || "").trim();
      return text.length > 12 ? `${text.slice(0, 6)}...${text.slice(-4)}` : text;
    }
    function routeAddresses(row) {
      const quote = row.quote || {};
      const route = quote.route || {};
      const identity = routeIdentity(row);
      return identity.routeAddresses || identity.route_addresses || evRouteAddresses(row) || row.route_addresses || row.routeAddresses || quote.routeAddresses || quote.route_addresses || route.pathAddresses || [];
    }
    function evRouteAddresses(row) {
      const ev = evidence(row);
      return ev.routeAddresses || ev.route_addresses || [];
    }
    function routeAddressText(row, {short = false} = {}) {
      const addresses = routeAddresses(row);
      if (!Array.isArray(addresses) || !addresses.length) return "";
      return addresses.map(address => short ? shortAddress(address) : address).join(" -> ");
    }
    function profitPercent(row) {
      const ev = evidence(row);
      const liveBps = numberValue(ev.net_profit_bps || ev.costModel?.netProfitBps);
      if (liveBps !== null) return {value: liveBps / 100, source: "链上复核"};
      const review = row.review_summary || {};
      const plan = review.plan || {};
      const quote = row.quote || {};
      const analysis = quote.quote_analysis || {};
      const precheck = row.precheck || {};
      const status = String(ev.status || "").toLowerCase();
      const staticSource = status === "not_live_verified" && analysis.requiresLiveQuoter ? "第三方参考价" : "静态观察";
      const direct = numberValue(plan.profit_percent ?? quote.profit_percent ?? precheck.expected_profit_percent);
      if (direct !== null) return {value: direct, source: staticSource};
      const bps = numberValue(analysis.netProfitBps);
      if (bps !== null) return {value: bps / 100, source: staticSource};
      const profitUsd = numberValue(analysis.netProfitUsd ?? row.final_delta_amount);
      const notional = numberValue(analysis.notionalUsd ?? quote.input_amount ?? precheck.notional_usd);
      if (profitUsd !== null && notional !== null && notional > 0) return {value: profitUsd / notional * 100, source: staticSource};
      return {value: null, source: "-"};
    }
    function fmtPct(result) {
      const parsed = numberValue(result?.value);
      if (parsed === null) return "-";
      return `${result.source} ${parsed >= 0 ? "+" : ""}${parsed.toLocaleString("zh-CN", {minimumFractionDigits: 2, maximumFractionDigits: 4})}%`;
    }
    function lines(items) {
      return (items || []).filter(item => item !== null && item !== undefined && String(item).trim() !== "");
    }
    async function copyText(text, button) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement("textarea");
          area.value = text;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.left = "-9999px";
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        const old = button.textContent;
        button.textContent = "已复制";
        setTimeout(() => { button.textContent = old; }, 1200);
      } catch (error) {
        $("message").textContent = `复制失败：${error.message}`;
      }
    }
    function evidenceBadge(row) {
      const ev = evidence(row);
      const status = String(ev.status || "").toLowerCase();
      const identityStatus = String(ev.routeIdentityStatus || ev.route_identity_status || routeIdentity(row).status || "").toLowerCase();
      if (identityStatus === "token_discontinuity") return '<span class="badge fail">token 地址不连续</span>';
      if (identityStatus === "symbol_only" || identityStatus === "address_partial") return '<span class="badge fail">地址身份不完整</span>';
      if (ev.trusted_for_execution || ev.trustedForExecution) return '<span class="badge live">可执行复核通过</span>';
      if (status === "live_verified") return '<span class="badge live">链上报价已复核</span>';
      if (status === "not_live_verified") return '<span class="badge fail">未通过链上复核</span>';
      if (status && status !== "not_live_verified") return `<span class="badge fail">${esc(status)}</span>`;
      return '<span class="badge static">静态观察</span>';
    }
    function reasonText(row) {
      const ev = evidence(row);
      const evReasons = ev.blockers || ev.blockers?.blockers || [];
      const base = row.reason || row.blocked_reason || (row.blocked_reasons || []).join("，") || (row.reasons || []).join("，") || row.error || "-";
      const hop = ev.hop_count || ev.hops?.length;
      const prefix = hop ? `每跳复核 ${hop} 跳。` : "";
      const reasons = Array.isArray(evReasons) && evReasons.length ? evReasons.join("，") : base;
      const issues = ev.tokenContinuityIssues || ev.token_continuity_issues || routeIdentity(row).tokenContinuityIssues || [];
      const issueText = Array.isArray(issues) && issues.length
        ? ` token 连续性异常：${issues.map(item => `${item.fromHop || "?"}->${item.toHop || "?"} ${shortAddress(item.previousTokenOut)} != ${shortAddress(item.currentTokenIn)}`).join("；")}`
        : "";
      return `${prefix}${reasons}${issueText}`;
    }
    function recordCopyText(row) {
      const ev = evidence(row);
      const pct = fmtPct(profitPercent(row));
      const status = row.review_category || row.category || row.status || row.state || row.submission_status || "-";
      const pair = row.pair || row.symbol_pair || row.route_key || row.order_uid || "-";
      const quote = row.quote || {};
      const analysis = quote.quote_analysis || {};
      const hops = ev.hops?.length ? ev.hops : (quote.hops || analysis.steps || []);
      const identity = routeIdentity(row);
      const addressPath = routeAddressText(row);
      return lines([
        `时间：${fmtTime(row.created_at || row.observed_at || row.updated_at)}`,
        `网络：${row.network || row.cow_network || "-"}`,
        `路径：${pair}`,
        `底层地址路径：${addressPath || "-"}`,
        `地址身份：${ev.routeIdentityStatus || ev.route_identity_status || identity.status || "-"}`,
        `状态：${status}`,
        `证据状态：${ev.status || "-"}`,
        `执行可信：${ev.trustedForExecution || ev.trusted_for_execution ? "是" : "否"}`,
        `触发区块：${ev.triggerBlockNumber || ev.trigger_block_number || "-"}`,
        `复核区块：${ev.blockNumber || ev.block_number || "-"}`,
        `盈亏比例：${pct}`,
        `订单/交易：${row.order_uid || row.tx_hash || row.transaction_hash || row.uid || "-"}`,
        "",
        "原因与复盘要点：",
        reasonText(row),
        "",
        "逐跳数据：",
        ...(hops.length ? hops.map(step => [
          `${step.hop || "-"}。${step.fromSymbol || step.from_symbol || "-"} -> ${step.toSymbol || step.to_symbol || "-"}`,
          `协议：${step.protocol || step.dex || "-"}`,
          `池子：${step.pool || "-"}`,
          `tokenIn：${step.tokenIn || step.token_in || "-"}`,
          `tokenOut：${step.tokenOut || step.token_out || "-"}`,
          `输入：${step.amountIn || step.inputAmount || "-"} ${step.fromSymbol || step.from_symbol || ""}`,
          `输出：${step.amountOut || step.outputAmount || "-"} ${step.toSymbol || step.to_symbol || ""}`,
          `方法：${step.quoteMethod || step.quoteSource || "-"}`,
        ].join(" | ")) : ["-"]),
      ]).join("\n");
    }
    function rowHtml(row, index) {
      const status = row.review_category || row.category || row.status || row.state || row.submission_status || "-";
      const pair = row.pair || row.symbol_pair || row.route_key || row.order_uid || "-";
      const ev = evidence(row);
      const order = row.order_uid || row.tx_hash || row.transaction_hash || row.uid || "-";
      const addresses = routeAddressText(row, {short: true});
      const pathCell = `${esc(pair)}${addresses ? `<div class="muted route-addresses">${esc(addresses)}</div>` : ""}`;
      return `<tr><td>${esc(fmtTime(row.created_at || row.observed_at || row.updated_at))}</td><td>${esc(row.network || row.cow_network || "-")}</td><td class="route-cell">${pathCell}</td><td>${evidenceBadge(row)}</td><td>${esc(ev.block_number || ev.blockNumber || "-")}</td><td>${esc(fmtPct(profitPercent(row)))}</td><td>${esc(status)}</td><td class="reason">${esc(reasonText(row))}</td><td>${esc(order)} <button class="copy-btn" type="button" data-copy-record="${index}">复制记录</button></td></tr>`;
    }
    async function refresh() {
      $("message").textContent = "正在加载提交记录...";
      try {
        const data = await fetchJson("/api/dex/submissions?limit=300");
        $("attemptCount").textContent = data.summary?.attemptCount ?? 0;
        $("successCount").textContent = data.summary?.successCount ?? 0;
        $("failedCount").textContent = data.summary?.failedCount ?? 0;
        $("blockedCount").textContent = data.summary?.blockedCount ?? 0;
        $("source").textContent = data.source || "-";
        latestRows = data.attempts || [];
        $("rows").innerHTML = latestRows.map(rowHtml).join("") || '<tr><td colspan="9">暂无提交记录。</td></tr>';
        $("message").textContent = "已更新";
      } catch (error) {
        $("message").textContent = error.message;
      }
    }
    async function clearRecords() {
      if (!confirm("确认清空当前链路的提交记录和机会复盘记录？")) return;
      $("clearBtn").disabled = true;
      $("message").textContent = "正在清空当前链路记录...";
      try {
        const data = await postJson("/api/dex/submissions/clear");
        $("message").textContent = `已清空 ${data.cleared ?? 0} 条记录`;
        await refresh();
      } catch (error) {
        $("message").textContent = error.message;
      } finally {
        $("clearBtn").disabled = false;
      }
    }
    $("refreshBtn").onclick = refresh;
    $("clearBtn").onclick = clearRecords;
    $("rows").addEventListener("click", event => {
      const button = event.target.closest("[data-copy-record]");
      if (!button) return;
      const row = latestRows[Number(button.dataset.copyRecord)];
      if (row) copyText(recordCopyText(row), button);
    });
    window.addEventListener("chainselectionchanged", event => {
      if (String(event?.detail?.selected?.feature || "").toLowerCase() === "dex_arbitrage") refresh();
    });
    refresh();
  </script>
</body>
</html>
