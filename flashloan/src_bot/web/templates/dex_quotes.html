<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEX quotes and routes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1420px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    button { min-height: 36px; border: 1px solid #0f766e; border-radius: 6px; padding: 0 12px; background: #0f766e; color: #fff; font-weight: 700; cursor: pointer; }
    button.copy-btn { min-height: 30px; border-color: #d0d5dd; background: #fff; color: #344054; font-size: 12px; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric, .route { border: 1px solid #d9dee7; border-radius: 8px; background: #fff; padding: 14px; }
    .metric small { display: block; color: #667085; margin-bottom: 7px; }
    .metric strong { display: block; font-size: 18px; }
    .metric span, .muted { color: #667085; font-size: 13px; }
    .route { margin-bottom: 12px; }
    .route-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: #eef6f4; color: #0f766e; font-weight: 700; font-size: 12px; }
    .badge.good { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .badge.warn { background: #fff7ed; color: #b45309; border: 1px solid #fed7aa; }
    .badge.bad { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .analysis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
    .analysis div { border: 1px solid #e4e7ec; border-radius: 6px; padding: 8px; background: #fafafa; }
    .analysis small { display: block; color: #667085; margin-bottom: 4px; }
    .analysis strong { font-size: 14px; }
    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #e4e7ec; padding: 8px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    .recommendation, .onchain-evidence { margin-top: 10px; padding: 10px; border-radius: 6px; border: 1px solid #e4e7ec; background: #f8fafc; }
    .onchain-evidence { display: grid; gap: 5px; border-color: #fecaca; background: #fff7f7; }
    .onchain-evidence.good { border-color: #bbf7d0; background: #f0fdf4; }
    .evidence-error { color: #b91c1c; font-weight: 700; overflow-wrap: anywhere; }
    ol { margin: 8px 0 0 18px; padding: 0; color: #344054; line-height: 1.55; }
    .empty { padding: 18px; color: #667085; background: #fff; border: 1px solid #d9dee7; border-radius: 8px; }
    @media (max-width: 860px) { header { display: block; } nav { margin-top: 10px; } .route-head { display: block; } }
  </style>
</head>
<body data-dex-surface-template="quotes">
  <header>
    <h1>DEX quotes and routes</h1>
    <nav>
      <a data-surface-link href="/dex">Quotes</a>
      <a data-surface-link href="/dex/overview">Overview</a>
      <a data-surface-link href="/dex/market-observation">Market observation</a>
      <a data-surface-link href="/dex/candidates">Candidate pools</a>
      <a data-surface-link href="/dex/submissions">Submissions</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="refreshBtn" type="button">Refresh routes</button>
      <label for="refreshInterval">Refresh interval (seconds)</label>
      <input id="refreshInterval" type="number" min="10" max="3600" step="1" value="180" inputmode="numeric">
      <span id="message" class="muted">Waiting for data</span>
    </div>
    <section class="grid">
      <div class="metric"><small>Route count</small><strong id="routeCount">-</strong><span id="routeSourceMeta">Market observation</span></div>
      <div class="metric"><small>1000U probes</small><strong id="completeCount">-</strong><span id="probeMeta">Live AMM verification</span></div>
      <div class="metric"><small>Preflight candidates</small><strong id="readyCount">-</strong><span id="profitMeta">After flash-loan and gas costs</span></div>
      <div class="metric"><small>Settlement</small><strong id="settlement">-</strong><span id="settlementMeta">-</span></div>
    </section>
    <section id="routeList"></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]));
    const lines = items => (Array.isArray(items) ? items : []).filter(item => item !== null && item !== undefined && String(item).trim() !== "");
    const numeric = (value, digits = 4) => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed.toLocaleString("en-US", {maximumFractionDigits: digits}) : "-";
    };
    const money = value => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? `${parsed < 0 ? "-" : ""}$${Math.abs(parsed).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : "-";
    };
    const amount = (value, symbol, digits = 8) => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? `${parsed.toLocaleString("en-US", {maximumFractionDigits: digits})} ${symbol || ""}`.trim() : "-";
    };
    const labelMap = {
      live_verified: "On-chain price verified",
      live_quote_failed: "On-chain quote failed",
      live_quote_reference_only: "Reference quote only",
      route_unprofitable: "Route is unprofitable",
      slippage_limit_exceeded: "Per-hop price impact exceeds 10 bps",
      pool_insufficient_for_profitable_execution: "Pool depth insufficient for profitable execution",
      live_evidence_deferred: "On-chain verification deferred",
      requires_live_quoter: "On-chain Quoter required",
      sdk_adapter_required: "V4 SDK adapter required",
      uniswap_v4_sdk_exact_input_single: "V4 SDK exact-input hop",
      uniswap_v4_sdk_exact_input_route: "V4 SDK exact-input route",
      quote_request_ready: "Quote request ready",
    };
    const label = value => labelMap[value] || value || "-";
    const routeEvidence = route => route?.live_onchain_evidence || route?.quoteAnalysis?.live_onchain_evidence || route?.quote?.live_onchain_evidence || {};
    const routeAnalysis = route => {
      const base = {...(route?.quoteAnalysis || {})};
      const evidence = routeEvidence(route);
      if (!Object.keys(evidence).length) return base;
      const costs = evidence.costModel || {};
      const live = Boolean(evidence.livePriceVerified || evidence.status === "live_verified");
      return {
        ...base,
        live_onchain_evidence: evidence,
        livePriceVerified: live,
        priceEvidenceMode: live ? "live_verified" : "live_required",
        priceEvidenceSource: evidence.priceEvidenceSource || (live ? "chain_live_quote" : "chain_live_quote_required"),
        finalOutputUsd: live ? costs.finalOutputUsd : null,
        grossProfitUsd: live ? costs.grossProfitUsd : null,
        netProfitUsd: live ? costs.netProfitUsd : null,
        netProfitBps: live ? costs.netProfitBps : null,
        referenceFinalOutputAmount: live ? costs.finalOutputAmount : null,
        referenceNetProfitAmount: live ? costs.netProfitAmount : null,
        referenceNetReturnBps: live ? costs.netProfitAmountBps : null,
        referenceInputSymbol: costs.borrowInputSymbol || base.referenceInputSymbol,
        steps: Array.isArray(evidence.hops) && evidence.hops.length ? evidence.hops.map((hop, index) => ({
          ...(base.steps?.[index] || {}), ...hop,
          inputAmount: hop.amountIn ?? hop.inputAmount,
          outputAmount: hop.amountOut ?? null,
          outputUsd: hop.amountOutRaw == null ? null : (hop.outputUsd ?? base.steps?.[index]?.outputUsd),
          effectiveRate: hop.amountOutRaw == null ? null : (hop.effectiveRate ?? base.steps?.[index]?.effectiveRate),
        })) : base.steps,
        recommendation: lines(evidence.blockers).length ? {level: evidence.status, action: evidence.readyForTransactionPreflight ? "On-chain verification complete; preflight still required" : "On-chain verification passed, but execution gates are blocked", reasons: evidence.blockers} : base.recommendation,
      };
    };
    const evidenceStatus = status => ({
      live_verified: "On-chain verification passed",
      live_quote_failed: "On-chain hop verification failed",
      live_quote_reference_only: "Reference quote only",
      route_unprofitable: "Route is unprofitable",
      slippage_limit_exceeded: "Per-hop price impact exceeds 10 bps",
      pool_insufficient_for_profitable_execution: "Pool depth insufficient for profitable execution",
      live_evidence_deferred: "On-chain verification deferred",
    }[String(status || "").toLowerCase()] || "On-chain verification incomplete");
    function onchainEvidenceHtml(evidence) {
      if (!evidence || !Object.keys(evidence).length) return "";
      const status = String(evidence.status || "").toLowerCase();
      const failed = (evidence.hops || []).filter(hop => hop?.liveQuoteError || String(hop?.status || "").toLowerCase() === "live_quote_failed");
      return `<div class="onchain-evidence ${status === "live_verified" ? "good" : "bad"}"
        data-onchain-status="${esc(status)}"><strong>${esc(evidenceStatus(status))}</strong>
        <span class="muted">Block ${esc(evidence.blockNumber || evidence.triggerBlockNumber || "-")} | trust ${esc(evidence.executionTrust || "-")}</span>
        ${failed.map(hop => `<div class="evidence-error">Hop ${esc(hop.hop || "-")} ${esc(hop.fromSymbol || "-")} -> ${esc(hop.toSymbol || "-")}: ${esc(hop.liveQuoteError || "quote failed")}</div>`).join("")}
        ${lines(evidence.blockers).map(item => `<div class="muted">${esc(item)}</div>`).join("")}</div>`;
    }
    const inputSymbol = (route, analysis) => route?.routeSymbols?.[0] || analysis?.referenceInputSymbol || analysis?.inputSymbol || "";
    const routeSizeAmount = (value, route, analysis) => amount(value, inputSymbol(route, analysis));
    function routeHtml(route, index) {
      const evidence = routeEvidence(route);
      const analysis = routeAnalysis(route);
      const live = Boolean(analysis.livePriceVerified || analysis.priceEvidenceMode === "live_verified");
      const steps = analysis.steps || [];
      const recommendation = analysis.recommendation || {};
      const requests = route.quoteInputs?.quoteRequests || [];
      const pools = route.quoteInputs?.candidatePools || [];
      const stepRows = steps.map(step => `<tr><td>${esc(step.hop)}</td><td>${esc(step.fromSymbol)} -> ${esc(step.toSymbol)}</td><td>${esc(step.protocol || step.dex || "-")}</td><td>${esc(label(step.quoteSource))}${step.liveQuoteError ? `<div class="evidence-error">${esc(step.liveQuoteError)}</div>` : ""}</td><td>${esc(step.pool || "-")}</td><td>${numeric(step.feeBps, 2)}</td><td>${numeric(step.inputAmount, 8)} ${esc(step.fromSymbol)}</td><td>${live ? `${numeric(step.outputAmount, 8)} ${esc(step.toSymbol)}` : `${numeric(step.referenceOutputAmount, 8)} ${esc(step.toSymbol)} (ref)`}</td><td>${live ? numeric(step.effectiveRate, 8) : numeric(step.referenceEffectiveRate, 8)}</td><td>${step.priceImpactBps == null ? "-" : `${numeric(step.priceImpactBps, 2)} / ${numeric(step.priceImpactLimitBps ?? evidence.validation?.hopPriceImpactLimitBps ?? 10, 0)} bps`}</td></tr>`).join("");
      const tokenProfit = analysis.referenceReturnBasis === "borrow_token" && analysis.referenceNetProfitAmount != null ? `${amount(analysis.referenceNetProfitAmount, analysis.referenceInputSymbol)} / ${numeric(analysis.referenceNetReturnBps, 2)} bps` : "-";
      const tokenProfitLabel = live ? "X-basis result" : "X-basis reference";
      const netProfitDisplay = live ? (analysis.netProfitUsd != null ? money(analysis.netProfitUsd) : tokenProfit) : tokenProfit;
      const netReturnDisplay = live ? numeric(analysis.netProfitBps ?? analysis.referenceNetReturnBps, 2) : numeric(analysis.referenceNetReturnBps, 2);
      const depthStatus = String(analysis.staticDepthStatus || "unavailable").toLowerCase();
      const depthKnown = live || depthStatus === "available";
      const depthLabel = depthStatus === "available" ? "Offline depth available" : depthStatus === "exceeds_10_bps" ? "Reduce amount: slippage > 10 bps" : "Offline depth unavailable";
      const recClass = ["live_quote_failed", "live_evidence_deferred", "pool_insufficient_for_profitable_execution", "slippage_limit_exceeded", "route_unprofitable"].includes(String(evidence.status || "").toLowerCase()) ? "bad" : (live ? "good" : "warn");
      return `<article class="route"><div class="route-head"><div><h2>${esc(route.symbolPair || route.routeSymbols?.join(" -> ") || "Route")}</h2><div class="badges">
        <span class="badge ${recClass}">${esc(recommendation.action || label(route.quoteStatus))}</span>
        <span class="badge">Path ${esc((route.routeSymbols || []).join(" -> "))}</span>
        <span class="badge ${live ? "good" : "warn"}">${live ? "Live price verified" : "Live price unavailable"}</span>
        <span class="badge ${Object.keys(evidence).length && evidence.status !== "live_verified" ? "bad" : "good"}">${esc(evidenceStatus(evidence.status || ""))}</span>
        <span class="badge ${depthStatus === "available" ? "good" : "warn"}">${esc(depthLabel)}</span>
      </div></div><button class="copy-btn" type="button" data-copy-route="${index}">复制本组</button></div>
      ${onchainEvidenceHtml(evidence)}
      <div class="analysis"><div><small>${live ? "1000U output" : "1000U output (reference)"}</small><strong>${depthKnown ? (live ? money(analysis.finalOutputUsd) : money(analysis.referenceFinalOutputUsd)) : "Pending depth exploration"}</strong></div><div><small>${live ? "Gross profit" : "Gross profit (reference)"}</small><strong>${depthKnown ? (live ? money(analysis.grossProfitUsd) : money(analysis.referenceGrossProfitUsd)) : "Pending depth exploration"}</strong></div><div><small>${live ? "Net profit" : "Net profit (reference)"}</small><strong>${depthKnown ? esc(netProfitDisplay) : "-"}</strong></div><div><small>${live ? "Net return bps" : "Net return bps (reference)"}</small><strong>${depthKnown ? netReturnDisplay : "-"}</strong></div><div><small>${tokenProfitLabel}</small><strong>${depthKnown ? esc(tokenProfit) : "-"}</strong></div><div><small>Initial probe amount</small><strong>${routeSizeAmount(route.sizeAnalysis?.recommendedBorrowInputAmount ?? route.sizeAnalysis?.tokenAmountSteps?.[0], route, analysis)}</strong></div><div><small>Max executable amount</small><strong>${routeSizeAmount(route.sizeAnalysis?.maxExecutableAmountRaw, route, analysis)}</strong></div></div>
      <div class="table-wrap"><table><thead><tr><th>Hop</th><th>Swap</th><th>Protocol</th><th>Quote source</th><th>Pool</th><th>Fee bps</th><th>Input</th><th>Output</th><th>Rate</th><th>Price impact / limit</th></tr></thead><tbody>${stepRows || '<tr><td colspan="10">No hop quote data</td></tr>'}</tbody></table></div>
      <div class="recommendation"><strong>Recommendation: ${esc(recommendation.action || "-")}</strong><ol>${lines(recommendation.reasons).map(item => `<li>${esc(item)}</li>`).join("")}</ol></div>
      <div class="muted">Pools: ${esc(pools.map(pool => pool.pool).join(" | ") || "-")}</div><div class="badges">${requests.map(item => `<span class="badge">${esc(label(item.venue))} / ${esc(label(item.quoteMode))} / ${esc(label(item.status))}</span>`).join("")}</div></article>`;
    }
    const refreshIntervalKey = "dex-quotes-refresh-interval-seconds";
    const defaultRefreshIntervalSeconds = 180;
    let refreshTimer = null;
    let refreshInFlight = false;
    let latestRoutes = [];
    let snapshotRefreshing = false;
    let selectionGeneration = 0;
    let activeSelectionSignature = "";
    const selectionSignature = () => {
      const query = window.ChainSelector?.currentQuery ? window.ChainSelector.currentQuery() : new URLSearchParams(window.location.search);
      return ["chain_id", "market_id", "protocols", "protocol_id", "dex_strategy"].map(key => query.get(key) || "").join("|").toLowerCase();
    };
    const beginSelectionRefresh = message => {
      selectionGeneration += 1; activeSelectionSignature = selectionSignature(); latestRoutes = [];
      $("routeList").innerHTML = `<div class="empty">${esc(message)}</div>`;
      ["routeCount", "completeCount", "readyCount"].forEach(id => $(id).textContent = "0");
    };
    const apiPath = path => {
      const scoped = window.ChainSelector?.withSelection ? window.ChainSelector.withSelection(path) : path;
      const url = new URL(scoped, window.location.origin);
      return url.pathname + url.search;
    };
    async function fetchJson(path) {
      const response = await fetch(apiPath(path), {cache: "no-cache", headers: {Accept: "application/json"}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function renderScannerResponse(response) {
      const responseChainId = response?.chain_id ?? response?.snapshot?.chain_id ?? "";
      const activeChainId = new URLSearchParams(window.location.search).get("chain_id") || "";
      if (responseChainId && activeChainId && String(responseChainId) !== activeChainId) return;
      const scanner = response.scanner || {}; const snapshot = response.snapshot || {}; const data = snapshot.payload || {}; const summary = data.summary || snapshot.summary || {};
      $("routeCount").textContent = summary.routeCount ?? summary.route_count ?? 0;
      $("completeCount").textContent = summary.completeStaticQuoteCount ?? summary.complete_static_quote_count ?? 0;
      $("readyCount").textContent = summary.executableCandidateCount ?? summary.executable_candidate_count ?? 0;
      $("routeSourceMeta").textContent = `${summary.pathSource || "market_observation"} | observation routes ${summary.marketObservationRouteCount ?? 0}`;
      const reviewed = summary.onchainEvidenceReviewedRouteCount ?? 0;
      const deferred = summary.onchainEvidenceDeferredRouteCount ?? summary.liveQuoterRequiredCount ?? 0;
      const failed = summary.onchainEvidenceFailedRouteCount ?? 0;
      $("probeMeta").textContent = `Probe ${numeric(summary.probeNotionalUsd ?? 1000, 2)}U | On-chain reviewed ${reviewed} | pending ${deferred}`;
      $("profitMeta").textContent = `Preflight ${summary.chainSubmissionCandidateCount ?? 0} | quote failed ${failed} | recording ${snapshot.recording?.source === "disabled" ? "off" : "on"}`;
      const uniswapx = data.dexSettlement?.uniswapx || {};
      $("settlement").textContent = uniswapx.supported ? "UniswapX available" : "AMM preferred";
      $("settlementMeta").textContent = uniswapx.supported ? "Intent quote channel enabled" : "No UniswapX settlement on this chain";
      latestRoutes = Array.isArray(data.routes) ? data.routes : [];
      $("routeList").innerHTML = latestRoutes.map(routeHtml).join("") || '<div class="empty">No route is ready for quote review.</div>';
      const duration = scanner.last_duration_ms == null ? "-" : `${scanner.last_duration_ms} ms`;
      $("message").textContent = `${scanner.running ? "Scanner running" : "Scanner stopped"} | ${duration} | scans ${scanner.scan_count ?? 0}${snapshot.error ? ` | ${snapshot.error}` : ""}`;
    }
    async function refreshSnapshot() {
      if (snapshotRefreshing || refreshInFlight) return; snapshotRefreshing = true; refreshInFlight = true;
      const generation = selectionGeneration; const signature = activeSelectionSignature;
      try { const response = await fetchJson("/api/dex/opportunity-scanner/snapshot"); if (generation === selectionGeneration && signature === activeSelectionSignature) renderScannerResponse(response); }
      catch (error) { if (generation === selectionGeneration && signature === activeSelectionSignature) $("message").textContent = error.message; }
      finally { snapshotRefreshing = false; refreshInFlight = false; }
    }
    async function startScanner() {
      const generation = selectionGeneration; const signature = activeSelectionSignature;
      try { const response = await fetchJson("/api/dex/opportunity-scanner/start"); if (generation === selectionGeneration && signature === activeSelectionSignature) renderScannerResponse(response); }
      catch (error) { if (generation === selectionGeneration && signature === activeSelectionSignature) $("message").textContent = error.message; }
    }
    async function refresh() {
      const generation = selectionGeneration; const signature = activeSelectionSignature; $("message").textContent = "Scanning current chain...";
      try { const response = await fetchJson("/api/dex/opportunity-scanner/scan-now"); if (generation === selectionGeneration && signature === activeSelectionSignature) renderScannerResponse(response); }
      catch (error) { if (generation === selectionGeneration && signature === activeSelectionSignature) $("message").textContent = error.message; }
    }
    async function copyRoute(route, button) {
      const evidence = routeEvidence(route); const analysis = routeAnalysis(route);
      const sourceAnalysis = route?.quoteAnalysis || {};
      const size = route?.sizeAnalysis || {};
      const costs = evidence.costModel || {};
      const display = value => value === null || value === undefined || value === "" ? "-" : String(value);
      const netProfit = analysis.netProfitUsd ?? sourceAnalysis.netProfitUsd ?? costs.netProfitUsd ?? sourceAnalysis.referenceNetProfitAmount ?? costs.netProfitAmount;
      const netProfitSymbol = analysis.netProfitUsd != null || sourceAnalysis.netProfitUsd != null || costs.netProfitUsd != null ? "USD" : (costs.netProfitAmountSymbol || sourceAnalysis.referenceInputSymbol || "token");
      const rows = Array.isArray(size.rows) ? size.rows : [];
      const hopLines = (sourceAnalysis.steps || []).map((step, index) => {
        const output = step.outputAmount ?? step.referenceOutputAmount;
        const rate = step.effectiveRate ?? step.referenceEffectiveRate;
        return `hop ${step.hop ?? index + 1}: ${display(step.fromSymbol)} -> ${display(step.toSymbol)} | input=${display(step.inputAmount)} ${display(step.fromSymbol)} | output=${display(output)} ${display(step.toSymbol)} | rate=${display(rate)} | feeBps=${display(step.feeBps)} | priceImpactBps=${display(step.priceImpactBps)}`;
      });
      const ladderLines = rows.map(row => `probe ${display(row.borrowAmount)} ${display(row.borrowSymbol || row.borrowBasis)} | output=${display(row.referenceFinalOutputAmount)} ${display(row.referenceFinalOutputSymbol)} | net=${display(row.referenceNetProfitAmount)} | bps=${display(row.referenceNetReturnBps)} | depth=${display(row.staticDepthStatus)} | executable=${display(row.executableCandidate)}`);
      const text = [
        `route=${display(route.symbolPair)}`,
        `path=${display((route.routeSymbols || []).join(" -> "))}`,
        `quoteStatus=${display(route.quoteStatus)}`,
        `evidenceStatus=${display(evidence.status)}`,
        `block=${display(evidence.blockNumber || evidence.triggerBlockNumber)}`,
        `executionTrust=${display(evidence.executionTrust)}`,
        `referenceInput=${display(sourceAnalysis.referenceInputAmount)} ${display(sourceAnalysis.referenceInputSymbol)}`,
        `initialProbe=${display(size.recommendedBorrowInputAmount)} ${display(size.recommendedBorrowInputAmountBasis || sourceAnalysis.referenceInputSymbol)}`,
        `referenceOutput=${display(sourceAnalysis.referenceFinalOutputAmount)} ${display(sourceAnalysis.referenceFinalOutputSymbol)}`,
        `referenceNetProfit=${display(sourceAnalysis.referenceNetProfitAmount)} ${display(sourceAnalysis.referenceInputSymbol)}`,
        `referenceNetReturnBps=${display(sourceAnalysis.referenceNetReturnBps)}`,
        `netProfit=${display(netProfit)} ${netProfitSymbol}`,
        `depthStatus=${display(sourceAnalysis.staticDepthStatus)}`,
        `maxStaticDepthImpactBps=${display(sourceAnalysis.maxStaticDepthImpactBps)}`,
        `depthImpactLimitBps=${display(sourceAnalysis.staticDepthImpactLimitBps || size.depthImpactLimitBps || 10)}`,
        `recommendation=${display((sourceAnalysis.recommendation || {}).action)}`,
        ...hopLines,
        ...ladderLines,
        ...(evidence.blockers || []),
        ...(sourceAnalysis.warnings || []),
      ].filter(Boolean).join("\n");
      try { await navigator.clipboard.writeText(text); const old = button.textContent; button.textContent = "Copied"; setTimeout(() => button.textContent = old, 1200); } catch (error) { $("message").textContent = error.message; }
    }
    $("refreshBtn").onclick = refresh;
    $("routeList").addEventListener("click", event => { const button = event.target.closest("[data-copy-route]"); if (button) copyRoute(latestRoutes[Number(button.dataset.copyRoute)], button); });
    window.addEventListener("chainselectionchanged", event => { if (String(event?.detail?.selected?.feature || "").toLowerCase() !== "dex_arbitrage") return; beginSelectionRefresh("Loading selected chain..."); startScanner().then(refreshSnapshot); });
    window.addEventListener("chainselectionprotocolschanged", () => { beginSelectionRefresh("Loading selected DEX..."); startScanner().then(refreshSnapshot); });
    beginSelectionRefresh("Loading current selection...");
    startScanner().then(refreshSnapshot);
    function normalizeRefreshInterval(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? Math.min(3600, Math.max(10, Math.floor(parsed))) : defaultRefreshIntervalSeconds;
    }
    function scheduleRefresh() {
      const seconds = normalizeRefreshInterval($("refreshInterval").value);
      $("refreshInterval").value = String(seconds);
      try { window.localStorage.setItem(refreshIntervalKey, String(seconds)); } catch (_) {}
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(refreshSnapshot, seconds * 1000);
    }
    try {
      $("refreshInterval").value = normalizeRefreshInterval(window.localStorage.getItem(refreshIntervalKey) || defaultRefreshIntervalSeconds);
    } catch (_) {}
    $("refreshInterval").addEventListener("change", scheduleRefresh);
    scheduleRefresh();
  </script>
</body>
