<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场观察 | DEX</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1420px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    button { min-height: 36px; border: 1px solid #0f766e; border-radius: 6px; padding: 0 12px; background: #0f766e; color: #fff; font-weight: 700; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .metric, .panel { border: 1px solid #d9dee7; border-radius: 8px; background: #fff; padding: 14px; }
    .metric small { display: block; color: #667085; margin-bottom: 7px; }
    .metric strong { display: block; font-size: 18px; }
    .muted, .metric span { color: #667085; font-size: 13px; }
    .token-list, .pool-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: #eef6f4; color: #0f766e; font-weight: 700; font-size: 12px; }
    .badge.warn { background: #fff7ed; color: #b45309; border: 1px solid #fed7aa; }
    .item { border-top: 1px solid #e4e7ec; padding: 10px 0; }
    .item:first-child { border-top: 0; }
    .item strong { display: block; margin-bottom: 5px; }
    @media (max-width: 920px) { header { display: block; } nav { margin-top: 10px; } .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-dex-surface-template="observation">
  <header>
    <h1>市场观察 | DEX</h1>
    <nav>
      <a data-surface-link href="/dex">报价与路由</a>
      <a data-surface-link href="/dex/overview">DEX 总览</a>
      <a data-surface-link href="/dex/market-observation">市场观察</a>
      <a data-surface-link href="/dex/candidates">候选池</a>
      <a data-surface-link href="/dex/submissions">提交记录</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="refreshBtn">刷新观察</button>
      <span id="message" class="muted">等待数据</span>
    </div>
    <section class="grid">
      <div class="metric"><small>观察锚点</small><strong id="borrowCount">-</strong><span id="borrowNames">-</span></div>
      <div class="metric"><small>直接闭环池</small><strong id="directCount">-</strong><span>锚点 token 直接进入的池</span></div>
      <div class="metric"><small>间接路由</small><strong id="indirectCount">-</strong><span>通过中间 token 形成闭环</span></div>
      <div class="metric"><small>未匹配池</small><strong id="unmatchedCount">-</strong><span>暂不能从可借 token 闭环</span></div>
    </section>
    <section class="split">
      <div class="panel">
      <h2>可直接闭环观察的池子</h2>
        <div id="directList"></div>
      </div>
      <div class="panel">
      <h2>可间接闭环观察的路径</h2>
        <div id="indirectList"></div>
      </div>
    </section>
    <section class="panel" style="margin-top:14px">
      <h2>暂未进入闭环观察的池子</h2>
      <div id="unmatchedList"></div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const apiPath = path => {
      const scoped = window.ChainSelector?.withSelection ? window.ChainSelector.withSelection(path) : path;
      const url = new URL(scoped, window.location.origin);
      return url.pathname + (url.search ? url.search : "");
    };
    async function fetchJson(path) {
      const response = await fetch(apiPath(path), {cache: "no-cache", headers: {"Accept": "application/json"}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function directHtml(row) {
      const matched = row.matchedObservationSymbols || row.matchedBorrowSymbols || [];
      return `<div class="item">
        <strong>${esc(row.symbolPair)}</strong>
        <div class="pool-list">
          <span class="badge">观察锚点 ${esc(matched.join(", "))}</span>
          <span class="badge">交易 ${esc((row.tradeSymbols || []).join(" / "))}</span>
          <span class="badge">池子 ${esc(row.poolCount)}</span>
          <span class="badge">${esc(row.classification?.pairClassLabel || row.classification?.pairClass || "-")}</span>
        </div>
      </div>`;
    }
    function indirectHtml(row) {
      return `<div class="item">
        <strong>${esc(row.pathText || `${row.borrowSymbol} -> ${row.bridgeSymbol} -> ${row.targetSymbol || "target"} -> ${row.borrowSymbol}`)}</strong>
        <div class="muted">第一跳池 ${esc(row.firstLegCount)} 个，第二跳候选 ${esc(row.secondLegCount)} 个</div>
        <div class="pool-list">${(row.secondLegPairs || []).map(pair => `<span class="badge warn">${esc(pair.symbolPair)}</span>`).join("")}</div>
      </div>`;
    }
    function unmatchedHtml(row) {
      return `<span class="badge warn">${esc(row.symbolPair)} (${esc((row.tradeSymbols || []).join(" / "))})</span>`;
    }
    async function refresh() {
      $("message").textContent = "正在加载市场观察...";
      try {
        const data = await fetchJson("/api/dex/market-observation");
        $("borrowCount").textContent = data.summary?.observationAnchorCount ?? data.summary?.borrowableTokenCount ?? 0;
        $("borrowNames").textContent = (data.observationAnchorSymbols || data.borrowableSymbols || []).join(", ") || "-";
        $("directCount").textContent = data.summary?.directPairCount ?? 0;
        $("indirectCount").textContent = data.summary?.indirectRouteCount ?? 0;
        $("unmatchedCount").textContent = data.summary?.unmatchedPairCount ?? 0;
        $("directList").innerHTML = (data.directPools || []).map(directHtml).join("") || '<div class="muted">当前选择下没有可借 token 直接交易池。</div>';
        $("indirectList").innerHTML = (data.indirectRoutes || data.closedLoopRoutes || []).map(indirectHtml).join("") || '<div class="muted">当前选择下没有可借 token 的闭环路径。</div>';
        $("unmatchedList").innerHTML = (data.unmatchedPools || []).map(unmatchedHtml).join("") || '<div class="muted">没有未匹配池子。</div>';
        $("message").textContent = "已更新";
      } catch (error) {
        $("message").textContent = error.message;
      }
    }
    $("refreshBtn").onclick = refresh;
    window.addEventListener("chainselectionchanged", event => {
      if (String(event?.detail?.selected?.feature || "").toLowerCase() === "dex_arbitrage") refresh();
    });
    window.addEventListener("chainselectionprotocolschanged", () => refresh());
    refresh();
  </script>
</body>
</html>
