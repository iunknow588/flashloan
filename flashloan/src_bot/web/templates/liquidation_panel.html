<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aave 清算监控</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1400px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    nav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    nav a, .link { color: #0f766e; font-weight: 700; text-decoration: none; }
    button, input { min-height: 38px; border: 1px solid #b8c0cc; border-radius: 6px; padding: 0 12px; background: #fff; font-weight: 700; }
    button.primary { border-color: #0f766e; background: #0f766e; color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .card { border: 1px solid #d9dee7; border-radius: 8px; padding: 14px; background: #fff; min-height: 82px; margin-bottom: 18px; }
    .card small { display: block; color: #667085; margin-bottom: 7px; }
    .card strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .card span { display: block; margin-top: 4px; color: #475467; font-size: 13px; font-variant-numeric: tabular-nums; }
    .notice { border: 1px solid #d9dee7; border-radius: 8px; padding: 12px; background: #fff; color: #344054; line-height: 1.45; margin-bottom: 18px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { border: 1px solid #e4e7ec; padding: 6px 8px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    .positive { color: #15803d; }
    .negative { color: #b42318; }
    .status-candidate { color: #b45309; }
    .status-watching { color: #475467; }
    .status-healthy { color: #2563eb; }
    .status-liquidatable { color: #b42318; }
    .hf-green { color: #15803d; }
    .hf-beige { color: #8a6d3b; }
    .hf-yellow { color: #b7791f; }
    .hf-orange { color: #c2410c; }
    .hf-red { color: #b42318; }
  </style>
</head>
<body>
  <header>
    <h1>Aave 清算监控</h1>
    <nav><a href="/">主控制台</a><a href="/opportunity-health">机会诊断</a><a href="/exchange-matrix">兑换矩阵</a><a href="/liquidation/account">单账户分析</a></nav>
    <div id="message"></div>
  </header>
  <main>
    <div class="notice">账户池是长期账户名册，记录曾经发生过借贷或被人工加入观察的账户，不因当前无借贷而删除。借贷风险池是实时状态池，每次启动和手动触发时重新查询账户池，只保留当前 HF 低于监控阈值的借贷账户，并按 HF 升序展示前 100 个。</div>
    <section class="grid">
      <div class="card"><small>账户池账户</small><strong id="accountPoolCount">-</strong><span id="accountPoolMeta">等待中</span></div>
      <div class="card"><small>风险池账户</small><strong id="borrowPoolCount">-</strong><span id="borrowPoolMeta">等待中</span></div>
      <div class="card"><small>最弱 HF</small><strong id="borrowPoolWorstHF">-</strong><span id="borrowPoolWorstMeta">等待中</span></div>
      <div class="card"><small>扫描状态</small><strong id="borrowPoolScanState">-</strong><span id="borrowPoolScanMeta">等待中</span></div>
    </section>
    <section class="card">
      <small>账户池</small>
      <div class="toolbar">
        <button id="dbInitBtn">初始化数据库</button>
        <button id="accountPoolRefreshBtn">刷新账户池</button>
        <button id="accountPoolScanBtn" class="primary">继续扫描账户池</button>
        <button id="accountPoolRestartBtn">从一年前重扫</button>
        <span id="accountPoolWindow">等待中</span>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>账户</th><th>来源</th><th>账户详情</th></tr></thead><tbody id="accountPoolBody"></tbody></table>
      </div>
    </section>
    <section class="card">
      <small>借贷风险池（动态借贷健康度，HF &lt; 监控阈值）</small>
      <div class="toolbar">
        <input id="liquidationScanIntervalInput" type="number" min="30" step="30" style="width:130px" title="借贷风险池刷新间隔秒">
        <input id="liquidationDiscoveryIntervalInput" type="number" min="30" step="300" style="width:140px" title="账户池扫描间隔秒">
        <button id="liquidationSettingsSaveBtn">保存参数</button>
        <button id="borrowPoolRefreshBtn">刷新风险池</button>
        <button id="borrowPoolScanBtn" class="primary">实时扫描借贷池</button>
        <span id="borrowPoolHealthMeta">等待中</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>账户</th><th>HF</th><th>状态</th><th>抵押价值</th><th>债务价值</th><th>候选数</th><th>更新时间</th><th>账户详情</th></tr></thead>
          <tbody id="borrowPoolBody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const api = async (p,o={}) => { const r=await fetch(p,{headers:{"Content-Type":"application/json"},...o}); const d=await r.json(); if(!r.ok) throw new Error(d.error||"请求失败"); return d; };
    let refreshingAccounts=false, scanningAccounts=false, refreshingBorrow=false, scanningBorrow=false;
    const fmtTime = v => v ? new Date(v).toLocaleString([], {hour12:false}) : "-";
    const moneyText = v => Number.isFinite(Number(v)) ? Number(v).toLocaleString(undefined,{maximumFractionDigits:4}) : "-";
    const statusCls = v => ({healthy:"status-healthy",liquidatable:"status-liquidatable",candidate:"status-candidate",warning:"status-candidate"}[String(v||"").toLowerCase()]||"status-watching");
    const hfCls = v => ({green:"hf-green",beige:"hf-beige",yellow:"hf-yellow",orange:"hf-orange",red:"hf-red"}[String(v||"").toLowerCase()]||"hf-red");
    const detailLink = account => account ? `/liquidation/account?account=${encodeURIComponent(account)}` : "/liquidation/account";
    function renderAccounts(d){ const rows=d.accounts||[], w=d.registry_window||{}; $("accountPoolCount").textContent=d.count??rows.length; $("accountPoolMeta").textContent=`来源 ${d.source||"-"}`; $("accountPoolWindow").textContent=`窗口 ${fmtTime(w.earliest_scan_start_at)} ~ ${fmtTime(w.latest_scan_end_at)} | 长期保留`; $("accountPoolBody").innerHTML=rows.map(row=>`<tr><td>${row.account||"-"}</td><td>${d.source||"-"}</td><td><a class="link" href="${detailLink(row.account)}">打开</a></td></tr>`).join("")||'<tr><td colspan="3">暂无账户池记录</td></tr>'; }
    function renderBorrowPool(d){ const rows=Array.isArray(d&&d.rows)?d.rows:[], s=d&&d.summary?d.summary:{}, running=Boolean(s.scan_running)||scanningBorrow; $("borrowPoolCount").textContent=Number.isFinite(s.count)?s.count:rows.length; $("borrowPoolMeta").textContent=Number.isFinite(s.watch_health_factor)?`HF < ${Number(s.watch_health_factor).toFixed(2)} | 前 ${s.display_limit||100}`:"等待中"; $("borrowPoolWorstHF").textContent=Number.isFinite(s.worst_health_factor)?Number(s.worst_health_factor).toFixed(3):"-"; $("borrowPoolWorstMeta").textContent=s.worst_account||"暂无风险账户"; $("borrowPoolScanState").textContent=running?"扫描中":"已就绪"; $("borrowPoolScanState").className=running?"status-candidate":"positive"; $("borrowPoolScanMeta").textContent=s.scan_finished_at?`完成 ${fmtTime(s.scan_finished_at)}`:(s.error||"等待扫描"); $("borrowPoolHealthMeta").textContent=s.error||`来源账户 ${s.source_account_count??"-"} | 已扫 ${s.scanned_account_count??"-"}`; $("borrowPoolScanBtn").disabled=running; $("borrowPoolScanBtn").textContent=running?"扫描中":"实时扫描借贷池"; $("borrowPoolBody").innerHTML=rows.map(row=>`<tr><td>${row.account||"-"}</td><td class="${hfCls(row.health_factor_band)}">${Number.isFinite(row.health_factor)?Number(row.health_factor).toFixed(3):"-"}</td><td class="${statusCls(row.status)}">${row.status||"-"}</td><td>${moneyText(row.total_collateral_base)}</td><td>${moneyText(row.total_debt_base)}</td><td>${Number.isFinite(row.candidate_count)?row.candidate_count:"-"}</td><td>${fmtTime(row.last_scanned_at)}</td><td><a class="link" href="${detailLink(row.account)}">打开</a></td></tr>`).join("")||'<tr><td colspan="8">暂无 HF 低于阈值的借贷账户</td></tr>'; }
    async function refreshAccounts(force=false){ if(refreshingAccounts)return; refreshingAccounts=true; try{ renderAccounts(await api(`/api/liquidation/accounts${force?"?force=1":""}`)); }catch(e){ $("message").textContent=e.message; } finally{ refreshingAccounts=false; } }
    async function refreshBorrowPool(){ if(refreshingBorrow)return; refreshingBorrow=true; try{ renderBorrowPool(await api("/api/liquidation/borrow-pool")); }catch(e){ $("message").textContent=e.message; } finally{ refreshingBorrow=false; } }
    async function scanBorrowPool(){ if(scanningBorrow)return; scanningBorrow=true; renderBorrowPool({rows:[],summary:{scan_running:true}}); try{ renderBorrowPool(await api("/api/liquidation/borrow-pool/scan",{method:"POST",body:"{}"})); }catch(e){ $("message").textContent=e.message; } finally{ scanningBorrow=false; refreshBorrowPool(); } }
    async function refreshSettings(){ try{ const d=await api("/api/liquidation-settings"); $("liquidationScanIntervalInput").value=Number.isFinite(d.scan_interval_seconds)?Math.round(d.scan_interval_seconds):300; $("liquidationDiscoveryIntervalInput").value=Number.isFinite(d.discovery_interval_seconds)?Math.round(d.discovery_interval_seconds):3600; }catch(e){ $("message").textContent=e.message; } }
    async function saveSettings(){ const b=$("liquidationSettingsSaveBtn"), old=b.textContent; b.disabled=true; b.textContent="保存中"; try{ await api("/api/liquidation-settings",{method:"POST",body:JSON.stringify({scan_interval_seconds:$("liquidationScanIntervalInput").value,discovery_interval_seconds:$("liquidationDiscoveryIntervalInput").value})}); $("message").textContent="清算参数已保存"; }catch(e){ $("message").textContent=e.message; } finally{ b.disabled=false; b.textContent=old; } }
    async function scanAccounts(full=false){ if(scanningAccounts)return; scanningAccounts=true; const b=full?$("accountPoolRestartBtn"):$("accountPoolScanBtn"), old=b.textContent; b.disabled=true; b.textContent=full?"重扫中":"扫描中"; try{ const d=await api(`/api/liquidation-discovery${full?"?full=1":""}`,{method:"POST",body:JSON.stringify({full})}); $("message").textContent=d.skipped?`账户池扫描跳过：${d.reason||"间隔未到"}`:`账户池新增/更新 ${d.count||0} 个账户`; refreshAccounts(true); }catch(e){ $("message").textContent=e.message; } finally{ scanningAccounts=false; b.disabled=false; b.textContent=old; } }
    async function initDb(){ const b=$("dbInitBtn"), old=b.textContent; b.disabled=true; b.textContent="初始化中"; try{ await api("/api/init",{method:"POST",body:"{}"}); $("message").textContent="数据库初始化完成"; refreshAccounts(true); refreshBorrowPool(); }catch(e){ $("message").textContent=e.message; } finally{ b.disabled=false; b.textContent=old; } }
    $("dbInitBtn").onclick=initDb; $("accountPoolRefreshBtn").onclick=()=>refreshAccounts(true); $("accountPoolScanBtn").onclick=()=>scanAccounts(false); $("accountPoolRestartBtn").onclick=()=>scanAccounts(true); $("borrowPoolRefreshBtn").onclick=refreshBorrowPool; $("borrowPoolScanBtn").onclick=scanBorrowPool; $("liquidationSettingsSaveBtn").onclick=saveSettings;
    refreshSettings(); refreshAccounts(); refreshBorrowPool(); setInterval(refreshBorrowPool,5000);
  </script>
</body>
</html>
