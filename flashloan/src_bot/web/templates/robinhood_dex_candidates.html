<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robinhood Shadow 候选池</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; flex-wrap: wrap; gap: 14px; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #d9dee7; }
    h1 { margin: 0; font-size: 20px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    main { width: min(1320px, 100%); margin: 0 auto; }
    button { min-height: 36px; border: 1px solid #0f766e; border-radius: 6px; padding: 0 12px; background: #0f766e; color: #fff; font-weight: 700; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .muted { color: #667085; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .metric, .status, .table-wrap { background: #fff; border: 1px solid #d9dee7; border-radius: 8px; }
    .metric { padding: 13px; min-height: 78px; }
    .metric small, .metric span { display: block; color: #667085; }
    .metric strong { display: block; margin: 6px 0; font-size: 18px; font-variant-numeric: tabular-nums; }
    .status { padding: 13px; line-height: 1.5; margin-bottom: 14px; }
    .status strong { display: inline-block; margin-right: 8px; }
    .bad { color: #b42318 !important; }
    .good { color: #15803d !important; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid #e4e7ec; text-align: left; vertical-align: top; }
    th { color: #475467; background: #fbfcfe; white-space: nowrap; }
    td { overflow-wrap: anywhere; }
    .badge { display: inline-block; padding: 3px 7px; border: 1px solid #d0d5dd; border-radius: 6px; background: #f3f4f6; color: #475467; font-size: 12px; font-weight: 700; }
    .empty { padding: 22px; color: #667085; }
    code { font-size: 12px; word-break: break-all; }
    @media (max-width: 680px) { header, main { padding: 14px; } }
  </style>
</head>
<body>
  <header>
    <h1>Robinhood Shadow 候选池</h1>
    <nav>
      <a href="/liquidation">清算</a>
      <a data-surface-link href="/dex">报价与路由</a>
      <a data-surface-link href="/dex/overview">DEX 概览</a>
      <a data-surface-link href="/dex/market-observation">市场观察</a>
      <a data-surface-link href="/robinhood-dex/candidates">候选池</a>
      <a data-surface-link href="/dex/submissions">提交记录</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="refresh">刷新</button>
      <span class="muted">仅展示已发现并通过证据校验的池子</span>
      <span id="updated" class="muted">等待数据</span>
    </div>
    <section class="summary">
      <div class="metric"><small>市场</small><strong id="market">-</strong><span id="chain">-</span></div>
      <div class="metric"><small>RPC 状态</small><strong id="rpc">-</strong><span id="block">-</span></div>
      <div class="metric"><small>已验证池子</small><strong id="count">-</strong><span id="source">-</span></div>
      <div class="metric"><small>执行状态</small><strong class="bad">已禁用</strong><span>当前为只读观察</span></div>
    </section>
    <section id="status" class="status"></section>
    <section class="table-wrap">
      <table>
        <thead>
          <tr><th>池地址</th><th>代币对</th><th>费率</th><th>Tick 间距</th><th>流动性</th><th>区块</th><th>证据</th><th>状态</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const fmt = value => value ? new Date(value).toLocaleString("zh-CN", { hour12: false }) : "-";
    const probeCheck = (status, name) => (status.checks || []).find(item => item.name === name) || {};
    const reasonLabels = {
      robinhood_dex_factory_source_unverified: "DEX Factory 来源未验证",
      robinhood_pool_discovery_evidence_missing: "池发现证据缺失",
      robinhood_live_quote_unverified: "实时报价未验证",
      robinhood_executor_unverified: "执行器未验证",
      robinhood_flashloan_provider_unverified: "闪电贷提供方未验证",
      robinhood_fork_simulation_unverified: "分叉模拟未验证",
      robinhood_lending_protocol_unverified: "借贷协议未验证",
      robinhood_liquidation_adapter_not_started: "清算适配器未启动"
    };
    const reasonText = value => (value || []).map(item => reasonLabels[item] || item).join("、");
    function applyLinks() {
      const current = new URLSearchParams(location.search);
      document.querySelectorAll("[data-surface-link]").forEach(link => {
        const target = new URL(link.getAttribute("href"), location.origin);
        target.searchParams.set("market_id", current.get("market_id") || "dex-arbitrage-4663-uniswap-v3");
        target.searchParams.set("chain_id", current.get("chain_id") || "4663");
        link.href = target.pathname + target.search;
      });
    }
    function render(data) {
      const market = data.market || {};
      const chainStatus = data.chainStatus || {};
      const block = probeCheck(chainStatus, "eth_blockNumber").value;
      const pools = data.pools || [];
      const summary = data.summary || {};
      const evidence = data.evidence || {};
      $("market").textContent = market.display_name || market.market_id || "-";
      $("chain").textContent = `${market.network || "-"} | 链 ID ${market.chain_id || "-"}`;
      $("rpc").textContent = chainStatus.ok ? "正常" : "未通过";
      $("rpc").className = chainStatus.ok ? "good" : "bad";
      $("block").textContent = block ? `区块 ${block}` : (chainStatus.error || "只读检查不可用");
      $("count").textContent = String(summary.poolCount || pools.length || 0);
      $("source").textContent = `证据来源：${evidence.source === "evidence_package" ? "证据包" : "无"}`;
      const statusNote = pools.length
        ? `<strong class="good">已验证池子：${esc(pools.length)}</strong> 仅展示池子自身数据，不包含兑换路径、报价或盈亏。`
        : `<strong class="bad">已验证池子：0</strong> 当前没有可展示的证据校验通过池子。`;
      $("status").innerHTML = statusNote;
      $("rows").innerHTML = pools.length ? pools.map(pool => {
        const e = pool.evidence || {};
        const pair = pool.symbolPair || [pool.token0Symbol, pool.token1Symbol].filter(Boolean).join(" / ") || `${pool.token0 || "-"} / ${pool.token1 || "-"}`;
        const fee = pool.fee === null || pool.fee === undefined || pool.fee === "" ? "-" : `${pool.fee}（${Number(pool.fee) / 10000}%）`;
        const evidenceText = [
          e.factoryQueryVerified ? "Factory 查询" : "",
          e.eventVerified ? "PoolCreated 事件" : "",
          e.poolCodeVerified ? "池代码" : "",
          e.poolStateVerified ? "池状态" : ""
        ].filter(Boolean).join("、") || "未完成";
        const method = e.discoveryMethod === "factory_getPool_readonly" ? "Factory getPool 只读查询" : (e.discoveryMethod || "-");
        return `<tr><td><code>${esc(pool.address)}</code></td><td>${esc(pair)}</td><td>${esc(fee)}</td><td>${esc(pool.tickSpacing)}</td><td>${esc(pool.liquidity)}</td><td>${esc(pool.observedBlock)}</td><td>${esc(evidenceText)}<br><span class="muted">${esc(method)}</span></td><td><span class="badge">${esc(pool.status === "observable" ? "可观察" : pool.status)}</span></td></tr>`;
      }).join("") : '<tr><td class="empty" colspan="8">暂无已发现并通过证据校验的池子。</td></tr>';
      $("updated").textContent = `刷新时间：${fmt(new Date().toISOString())}`;
    }
    let refreshController = null;
    async function refresh() {
      if (refreshController) refreshController.abort();
      refreshController = new AbortController();
      const controller = refreshController;
      const timeout = window.setTimeout(() => controller.abort(), 30000);
      $("refresh").disabled = true;
      $("updated").textContent = "正在读取 Robinhood 池数据...";
      try {
        const current = new URLSearchParams(location.search);
        const query = new URLSearchParams({ market_id: current.get("market_id") || "dex-arbitrage-4663-uniswap-v3", chain_id: current.get("chain_id") || "4663" });
        const response = await fetch(`/api/robinhood-dex/pools?${query}`, { cache: "no-cache", signal: controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        render(data);
        applyLinks();
      } catch (error) {
        $("updated").textContent = error.name === "AbortError" ? "读取超时，请稍后重试。" : `读取失败：${error.message}`;
      } finally {
        window.clearTimeout(timeout);
        if (refreshController === controller) refreshController = null;
        $("refresh").disabled = false;
      }
    }
    window.addEventListener("chainselectionchanged", event => {
      const selected = event?.detail?.selected || {};
      if (String(selected.feature || "").toLowerCase() !== "dex_arbitrage") return;
      refresh();
    });
    $("refresh").onclick = refresh;
    applyLinks();
    refresh();
  </script>
</body>
</html>
