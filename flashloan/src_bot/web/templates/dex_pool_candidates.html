<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEX 候选池</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1480px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0; font-size: 16px; }
    h3 { margin: 0; font-size: 14px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    button, input, select { min-height: 38px; border: 1px solid #b8c0cc; border-radius: 6px; padding: 0 12px; background: #fff; font-weight: 700; }
    input { min-width: 240px; }
    button.primary { border-color: #0f766e; background: #0f766e; color: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric { border: 1px solid #d9dee7; border-radius: 8px; padding: 14px; background: #fff; min-height: 82px; }
    .metric small { display: block; color: #667085; margin-bottom: 7px; }
    .metric strong { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .metric span { display: block; margin-top: 4px; color: #475467; font-size: 13px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .notice { border: 1px solid #d9dee7; border-radius: 8px; padding: 12px; background: #fff; color: #344054; line-height: 1.5; margin-bottom: 16px; }
    .group { border: 1px solid #d9dee7; border-radius: 8px; background: #fff; margin-bottom: 14px; overflow: hidden; }
    .group-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 12px 14px; border-bottom: 1px solid #e4e7ec; background: #fbfcfe; }
    .group-meta { color: #667085; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .section { padding: 12px 14px; border-top: 1px solid #eef2f6; }
    .section:first-of-type { border-top: 0; }
    .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #cfe8e3; background: #eef6f4; color: #0f766e; border-radius: 999px; padding: 4px 8px; font-size: 12px; font-weight: 700; }
    .chip small { color: #475467; font-weight: 600; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; }
    .badge.good { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .badge.warn { background: #fff7ed; color: #b45309; border: 1px solid #fed7aa; }
    .badge.neutral { background: #eef6f4; color: #0f766e; border: 1px solid #cfe8e3; }
    .badge.reject { background: #f3f4f6; color: #667085; border: 1px solid #d0d5dd; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #e4e7ec; padding: 8px 9px; text-align: right; white-space: nowrap; vertical-align: top; }
    th:first-child, td:first-child { text-align: left; }
    td.addr { font-family: Consolas, "Courier New", monospace; }
    .muted { color: #667085; }
    .positive { color: #15803d; }
    .negative { color: #b42318; }
    .empty { padding: 18px 14px; color: #667085; }
    .filters-line { color: #475467; font-size: 12px; margin-bottom: 10px; line-height: 1.45; }
    main, table, td, th, .metric, .notice, .group { user-select: text; }
    button, input, select { user-select: none; }
    @media (max-width: 860px) {
      header { display: block; }
      nav { margin-top: 10px; }
      input { min-width: 160px; width: 100%; }
      .group-head { display: block; }
      .section-head { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <h1>DEX 候选池</h1>
    <nav>
      <a href="/liquidation">清算</a>
      <a href="/account-scan">账户扫描</a>
      <a data-surface-link href="/dex">报价与路由</a>
      <a data-surface-link href="/dex/overview">DEX 总览</a>
      <a data-surface-link href="/dex/market-observation">市场观察</a>
      <a data-surface-link href="/dex/candidates">候选池</a>
      <a href="/execution">执行</a>
      <a href="/config">配置</a>
    </nav>
    <div id="message"></div>
  </header>
  <main>
    <div class="toolbar">
      <button class="primary" id="refreshBtn">刷新页面数据</button>
      <input id="searchInput" type="search" placeholder="搜索 X、YC、ZC、池子地址">
      <select id="qualityFilter">
        <option value="all" selected>显示全部分组</option>
        <option value="with_data">仅看有候选</option>
        <option value="empty">仅看空分组</option>
      </select>
      <span id="refreshMeta" class="muted">等待数据</span>
    </div>

    <section class="summary-grid">
      <div class="metric"><small>静态池</small><strong id="staticPools">-</strong><span id="staticPairs">-</span></div>
      <div class="metric"><small>X 分组</small><strong id="anchorGroups">-</strong><span id="anchorTokens">-</span></div>
      <div class="metric"><small>YC 候选</small><strong id="ycPools">-</strong><span id="ycTokens">-</span></div>
      <div class="metric"><small>ZC 候选</small><strong id="zcPools">-</strong><span id="zcTokens">-</span></div>
      <div class="metric"><small>链上快照</small><strong id="blockNumber">-</strong><span id="generatedAt">-</span></div>
    </section>

    <div class="notice" id="scopeNotice">
      本页按资金池 X 分组展示候选池。每个 X 下面拆成 YC 和 ZC 两个方向：YC 表示 X 可兑换出去的方向，ZC 表示可兑换回 X 的方向。页面只负责候选结构，不负责最终报价与盈亏判断。
    </div>
    <div id="filtersLine" class="filters-line"></div>
    <section id="groupList"></section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const shortAddress = value => {
      const text = String(value || "").trim();
      return text.startsWith("0x") && text.length === 42 ? `${text.slice(0, 8)}...${text.slice(-6)}` : (text || "-");
    };
    const compact = (value, max = 28) => {
      const text = String(value || "-").trim();
      return text.length > max ? `${text.slice(0, max)}...` : text;
    };
    const fmtTime = value => value ? new Date(value).toLocaleString([], { hour12: false }) : "-";
    const num = value => {
      const parsed = Number(value);
      if (!Number.isFinite(parsed)) return "-";
      if (Math.abs(parsed) >= 1000) return parsed.toLocaleString(undefined, { maximumFractionDigits: 2 });
      return parsed.toLocaleString(undefined, { maximumFractionDigits: 8 });
    };
    const sortRows = rows => (Array.isArray(rows) ? rows.slice() : []).sort((a, b) => {
      const aTvl = Number((a?.balances || {}).tvlUsd || 0);
      const bTvl = Number((b?.balances || {}).tvlUsd || 0);
      if (bTvl !== aTvl) return bTvl - aTvl;
      return String(a?.routeText || a?.pool || "").localeCompare(String(b?.routeText || b?.pool || ""));
    });
    let latestPayload = null;

    async function api(path) {
      const resp = await fetch(path, { headers: { "Accept": "application/json" }, cache: "no-cache" });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data;
    }

    function candidatesApiPath() {
      const query = new URLSearchParams(window.location.search);
      if (!query.get("feature")) query.set("feature", "dex_arbitrage");
      return `/api/dex-pools/candidates?${query.toString()}`;
    }

    function statusBadge(quality) {
      const value = String(quality || "").toLowerCase();
      if (value === "pass" || value === "recommended") return '<span class="badge good">可候选</span>';
      if (value === "observable") return '<span class="badge neutral">可观察</span>';
      return '<span class="badge reject">待确认</span>';
    }

    function renderTokenChips(tokens) {
      return (tokens || []).map(token => {
        const label = token.address ? `${token.symbol} ${shortAddress(token.address)}` : token.symbol;
        return `<span class="chip" title="${esc(token.symbol)}">${esc(compact(label, 34))}<small>${esc(token.poolCount || 0)}池</small></span>`;
      }).join("");
    }

    function renderPoolTable(rows) {
      const items = sortRows(rows);
      if (!items.length) return '<div class="empty">暂无候选</div>';
      return `<div class="table-wrap"><table>
        <thead>
          <tr>
            <th>路径</th><th>池</th><th>对手代币</th><th>协议</th><th>费率</th><th>TVL</th><th>流动性</th><th>质量</th>
          </tr>
        </thead>
        <tbody>${items.map(row => {
          const balances = row.balances || {};
          const counter = row.counterSymbol ? `${row.counterSymbol} ${shortAddress(row.counterAddress)}` : "-";
          return `<tr>
            <td title="${esc(row.routeText || "-")}">${esc(compact(row.routeText || "-", 36))}</td>
            <td class="addr" title="${esc(row.pool)}">${esc(shortAddress(row.pool))}</td>
            <td title="${esc(counter)}">${esc(compact(counter, 30))}</td>
            <td>${esc(row.protocol || row.dex || "-")}</td>
            <td>${esc(row.fee ?? "-")}</td>
            <td>${num(balances.tvlUsd)}</td>
            <td>${esc(row.liquidity || "-")}</td>
            <td>${statusBadge(row.quality || row.status)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table></div>`;
    }

    function renderSection(label, tokens, pools) {
      return `
        <div class="section">
          <div class="section-head">
            <div>
              <h3>${label}</h3>
              <div class="group-meta">${esc(label)} 方向代币 ${esc(tokens.length || 0)} 个，候选池 ${esc(pools.length || 0)} 个</div>
            </div>
            <div class="chip-row">${renderTokenChips(tokens)}</div>
          </div>
          ${renderPoolTable(pools)}
        </div>
      `;
    }

    function groupMatches(group, query) {
      if (!query) return true;
      const parts = [
        group.anchorSymbol,
        ...(group.anchorAddresses || []),
        ...(group.ycTokens || []).map(item => [item.symbol, item.address, item.poolCount].join(" ")),
        ...(group.zcTokens || []).map(item => [item.symbol, item.address, item.poolCount].join(" ")),
        ...(group.ycPools || []).map(row => [row.pool, row.routeText, row.counterSymbol, row.counterAddress, row.protocol, row.fee].join(" ")),
        ...(group.zcPools || []).map(row => [row.pool, row.routeText, row.counterSymbol, row.counterAddress, row.protocol, row.fee].join(" ")),
      ].join(" ").toLowerCase();
      return parts.includes(query);
    }

    function renderLegacyPairs(payload) {
      const pairs = payload.pairs || [];
      if (!pairs.length) return '<div class="notice">暂无候选数据。</div>';
      return `<div class="notice">当前数据仍是旧 pair 结构，页面已兼容展示，但建议升级到 anchorGroups。</div>`;
    }

    function renderGroups(payload) {
      const query = $("searchInput").value.trim().toLowerCase();
      const filter = $("qualityFilter").value;
      const groups = (payload.anchorGroups || []).filter(group => {
        const hasData = Number(group.ycPoolCount || 0) > 0 || Number(group.zcPoolCount || 0) > 0;
        if (filter === "with_data" && !hasData) return false;
        if (filter === "empty" && hasData) return false;
        return groupMatches(group, query);
      });
      if (!groups.length) {
        $("groupList").innerHTML = '<div class="notice">没有匹配的候选分组。</div>';
        return;
      }
      $("groupList").innerHTML = groups.map(group => `
        <article class="group">
          <div class="group-head">
            <div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                <h2 title="${esc(group.anchorSymbol)}">${esc(group.anchorSymbol)}</h2>
                <span class="badge good">X</span>
                <span class="badge neutral">YC ${esc(group.ycTokenCount || 0)} / ${esc(group.ycPoolCount || 0)}</span>
                <span class="badge neutral">ZC ${esc(group.zcTokenCount || 0)} / ${esc(group.zcPoolCount || 0)}</span>
                <span class="badge warn">池 ${esc(group.candidatePoolCount || 0)}</span>
              </div>
              <div class="group-meta">锚点地址：${(group.anchorAddresses || []).map(addr => `<code>${esc(addr)}</code>`).join(" · ") || "-"}</div>
            </div>
            <div class="group-meta">页面只展示候选方向，不做最终盈亏裁决。</div>
          </div>
          ${renderSection("YC", group.ycTokens || [], group.ycPools || [])}
          ${renderSection("ZC", group.zcTokens || [], group.zcPools || [])}
        </article>
      `).join("");
    }

    function render(payload) {
      const summary = payload.summary || {};
      const source = payload.poolStaticTable || {};
      $("staticPools").textContent = summary.staticPoolCount || summary.pairTableCount || "-";
      $("staticPairs").textContent = `交易对 ${summary.staticPairCount || summary.pairTableCount || "-"}`;
      $("anchorGroups").textContent = summary.anchorGroupCount || payload.anchorGroups?.length || "-";
      $("anchorTokens").textContent = `锚点 ${summary.anchorGroupCount || payload.anchorGroups?.length || "-"}`;
      $("ycPools").textContent = summary.ycPoolCount || "-";
      $("ycTokens").textContent = `代币 ${summary.ycTokenCount || "-"}`;
      $("zcPools").textContent = summary.zcPoolCount || "-";
      $("zcTokens").textContent = `代币 ${summary.zcTokenCount || "-"}`;
      $("blockNumber").textContent = source.generatedBlockNumber || "-";
      $("generatedAt").textContent = fmtTime(source.generatedAt);
      $("filtersLine").textContent = `来源 ${source.path || "-"} | 网络 ${source.network || "-"} | Chain ${source.chainId || "-"}`;
      $("refreshMeta").textContent = `刷新时间 ${fmtTime(new Date().toISOString())}`;
      $("scopeNotice").textContent = `本页按资金池 X 分组展示候选池。YC 表示从 X 出发的候选方向，ZC 表示可返回 X 的候选方向；同一池在不同方向下会分别进入两个分区，便于后续观察室和纵览页继续筛选。`;
      renderGroups(payload);
    }

    async function refresh() {
      $("message").textContent = "加载中...";
      try {
        latestPayload = await api(candidatesApiPath());
        render(latestPayload);
        $("message").textContent = "已更新";
      } catch (err) {
        $("message").textContent = err.message;
      }
    }

    $("refreshBtn").onclick = refresh;
    $("searchInput").oninput = () => latestPayload && renderGroups(latestPayload);
    $("qualityFilter").onchange = () => latestPayload && renderGroups(latestPayload);
    window.addEventListener("chainselectionchanged", event => {
      if (String(event?.detail?.selected?.feature || "").toLowerCase() === "dex_arbitrage") refresh();
    });
    window.addEventListener("chainselectionprotocolschanged", () => refresh());
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
