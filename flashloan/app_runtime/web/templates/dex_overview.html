<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEX 总览</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; color: #17202a; background: #f6f7f9; }
    header, main { padding: 18px 24px; }
    header { display: flex; justify-content: space-between; gap: 12px; background: #fff; border-bottom: 1px solid #d9dee7; }
    main { width: min(1420px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0; font-size: 16px; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    nav a { color: #0f766e; font-weight: 700; text-decoration: none; }
    button { min-height: 36px; border: 1px solid #0f766e; border-radius: 6px; padding: 0 12px; background: #0f766e; color: #fff; font-weight: 700; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric, .panel, .path { border: 1px solid #d9dee7; border-radius: 8px; background: #fff; padding: 14px; }
    .metric small { display: block; color: #667085; margin-bottom: 7px; }
    .metric strong { display: block; font-size: 18px; }
    .metric span, .muted { color: #667085; font-size: 13px; }
    .path { margin-bottom: 12px; }
    .path-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: #eef6f4; color: #0f766e; font-weight: 700; font-size: 12px; }
    .badge.good { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .badge.warn { background: #fff7ed; color: #b45309; border: 1px solid #fed7aa; }
    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid #e4e7ec; padding: 8px; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    .empty { padding: 18px; color: #667085; background: #fff; border: 1px solid #d9dee7; border-radius: 8px; }
    @media (max-width: 860px) { header { display: block; } nav { margin-top: 10px; } .path-head { display: block; } }
  </style>
</head>
<body data-dex-surface-template="overview">
  <header>
    <h1>DEX 总览</h1>
    <nav>
      <a data-surface-link href="/dex">报价与路由</a>
      <a data-surface-link href="/dex/overview">DEX 总览</a>
      <a data-surface-link href="/dex/market-observation">市场观察</a>
      <a data-surface-link href="/dex/candidates">候选池</a>
      <a data-surface-link href="/dex/submissions">提交记录</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button id="refreshBtn">刷新总览</button>
      <button id="rebuildBtn">重新生成总览</button>
      <span id="message" class="muted">等待数据</span>
    </div>
    <section class="grid">
      <div class="metric"><small>市场观察闭环</small><strong id="pathCount">-</strong><span id="pathMeta">来自链路观察</span></div>
      <div class="metric"><small>关联 Y-Z 交易对</small><strong id="watchCount">-</strong><span id="watchMeta">观察池来源</span></div>
      <div class="metric"><small>1000U 盈亏探针</small><strong id="profitCount">-</strong><span id="profitMeta">路由级总览</span></div>
      <div class="metric"><small>最佳参考净利</small><strong id="bestProfit">-</strong><span id="bestProfitMeta">扣除闪电贷费与 gas</span></div>
      <div class="metric"><small>当前链资金来源协议</small><strong id="flashCount">-</strong><span id="flashNames">-</span></div>
      <div class="metric"><small>池子来源</small><strong id="sourceNetwork">-</strong><span id="sourceMeta">-</span></div>
      <div class="metric"><small>有流动性池</small><strong id="liquidPoolCount">-</strong><span id="liquidPoolMeta">显式有流动性</span></div>
    </section>
    <section class="panel" style="margin-bottom:14px">
      <h2>关联 Y-Z 交易对</h2>
      <div class="muted">总览与市场观察使用同一份链路观察结果；这里列出可进入闭环报价的中间交易对。</div>
      <div id="watchList" class="badges"></div>
    </section>
    <section class="panel" style="margin-bottom:14px">
      <div class="path-head">
        <div>
          <h2>有流动性中间兑换池</h2>
          <div class="muted">来自候选池的有流动性池目录；未进入完整闭环时仍在此列出，报价页会保持“未标注/无闭环”区分。</div>
        </div>
        <div class="badges"><span class="badge" id="liquidRegistryCount">-</span></div>
      </div>
      <div id="liquidRegistryList" class="badges"></div>
    </section>
    <section id="pathList"></section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? "-").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    const uiError = value => {
      const text = String(value || "请求失败");
      if (/^HTTP \d+$/.test(text)) return `请求失败（${text}）`;
      if (/[\u4e00-\u9fff]/.test(text)) return text;
      return `接口错误（${text}）`;
    };
    const list = value => Array.isArray(value) ? value : [];
    const recommendationAction = value => {
      const map = {
        "on-chain step-by-step reverify failed; blocking transaction preflight": "链上逐步复核失败；正在阻止链上执行",
        "on-chain reverify complete; current state does not satisfy transaction submission conditions": "链上复核完成；当前状态不满足提交条件",
        "on-chain reverify complete": "链上复核完成",
        "waiting for live quoter": "等待链上实时报价",
        "static reference only": "静态参考",
        "ready for transaction preflight": "可进入链上执行",
        "blocking transaction preflight": "阻止链上执行",
      }[String(value || "")];
      if (map) return map;
      if (/[\u4e00-\u9fff]/.test(String(value || ""))) return value;
      return value || "-";
    };
    const num = (value, digits = 4) => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed.toLocaleString("zh-CN", {maximumFractionDigits: digits}) : "-";
    };
    const fmtTime = value => value ? new Date(value).toLocaleString([], { hour12: false }) : "-";
    const money = value => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? `${parsed >= 0 ? "" : "-"}$${Math.abs(parsed).toLocaleString("zh-CN", {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : "-";
    };
    const amount = (value, symbol, digits = 8) => {
      if (value === null || value === undefined || value === "") return "-";
      const parsed = Number(value);
      return Number.isFinite(parsed) ? `${parsed.toLocaleString("zh-CN", {maximumFractionDigits: digits})} ${symbol || ""}`.trim() : "-";
    };
    const overviewPoolFeeText = pool => {
      if (pool?.dynamicFee || String(pool?.feeLabel || "").toLowerCase() === "dynamic") {
        return '<span class="badge warn" title="动态费率池的费率由 Hook 在执行时决定，不按固定费率进入可用市场观察">动态费率</span>';
      }
      if (pool?.specialFee || String(pool?.feeLabel || "").toLowerCase() === "special") {
        return '<span class="badge warn" title="特殊费率池通常由 Hook 控制，需要本地 fork 模拟验证后才可用于套利">特殊费率</span>';
      }
      return esc(pool?.fee ?? pool?.feeLabel ?? "-");
    };
    const overviewPoolLiquidity = pool => {
      const depth = pool?.depthBand || {};
      const label = depth.label || pool?.depthStatus || "-";
      const liq = Number(pool?.liquidityIndex ?? pool?.liquidity ?? 0);
      const tvl = Number((pool?.balances || {}).tvlUsd ?? pool?.estimatedTvlUsd ?? 0);
      const usable = pool?.usableForObservation ?? (pool?.hasLiquidity && !pool?.specialFee && !pool?.dynamicFee);
      if (usable === true) return `<span class="badge good">有流动性</span> ${esc(label)}${liq > 0 ? ` / L=${num(liq)}` : ""}${tvl > 0 ? ` / $${num(tvl)}` : ""}`;
      if (usable === false) return `<span class="badge warn">无流动性</span> ${esc(label)}${tvl > 0 ? ` / $${num(tvl)}` : ""}`;
      return `<span class="badge">流动性未标注</span> ${esc(label)}${tvl > 0 ? ` / $${num(tvl)}` : ""}`;
    };
    const overviewPoolUsable = pool => {
      if (!pool) return false;
      if (pool.usableForObservation != null) return pool.usableForObservation === true;
      if (pool.dynamicFee || pool.specialFee || String(pool.feeLabel || "").toLowerCase() === "special") return false;
      if (pool.hasLiquidity != null) return pool.hasLiquidity === true;
      return Number(pool.liquidityIndex ?? pool.liquidity ?? 0) > 0;
    };
    function liquidRegistryHtml(rows) {
      const pools = list(rows);
      if (!pools.length) return '<span class="badge">暂无候选有流动性池</span>';
      return pools.map(pool => {
        const pair = pool.symbolPair || pool.pairSymbol || [pool.token0Symbol, pool.token1Symbol].filter(Boolean).join(":");
        const id = pool.pool || pool.poolId || "-";
        const usable = pool.usableForObservation === true || pool.hasLiquidity === true;
        const cls = usable ? "good" : "warn";
        const label = usable ? "有流动性" : "无流动性";
        const shortId = String(id || "").length > 18 ? `${String(id).slice(0, 14)}...` : id;
        return `<span class="badge ${cls}" title="${esc(id)}">${esc(pair || "-")} / ${esc(shortId)} / ${esc(label)}</span>`;
      }).join("");
    }
    const pathLiquidPoolCount = pair => {
      const pools = pair.executionPools || pair.preferredPools || [];
      return pools.filter(overviewPoolUsable).length;
    };
    const shortPoolId = value => {
      const text = String(value || "");
      return text.length > 18 ? `${text.slice(0, 14)}...` : text;
    };
    const hopCandidateTableHtml = (candidates, combinationCount) => {
      const rows = list(candidates);
      if (!rows.length) return '<div class="muted">暂无可展开的每跳候选池</div>';
      const body = rows.map(candidate => {
        const pools = list(candidate.pools);
        const preferred = String(candidate.preferredPoolId || "").toLowerCase();
        const chips = pools.slice(0, 6).map(pool => {
          const id = String(pool?.pool || pool?.poolId || "-");
          const preferredMark = preferred && preferred === String(id).toLowerCase() ? " / 深度首选" : "";
          return `<span class="badge ${overviewPoolUsable(pool) ? "good" : "warn"}" title="${esc(id)}">${esc(shortPoolId(id))}${esc(preferredMark)} ${overviewPoolLiquidity(pool)}</span>`;
        }).join("");
        return `<tr>
          <td>${esc(candidate.leg || "-")}</td>
          <td>${esc(candidate.direction || "-")}</td>
          <td>${esc(candidate.symbolPair || "-")}</td>
          <td>${esc(candidate.poolCount ?? pools.length)}</td>
          <td>${esc(candidate.usablePoolCount ?? "-")}</td>
          <td>${esc(candidate.preferredPoolId || "-")}</td>
          <td>${chips || '<span class="muted">无候选池明细</span>'}</td>
        </tr>`;
      }).join("");
      return `<div class="table-wrap"><h4>每跳候选池（组合 ${esc(combinationCount || 1)}）</h4><table>
        <thead><tr><th>跳</th><th>方向</th><th>交易对</th><th>候选池</th><th>可用池</th><th>深度首选</th><th>池列表</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>`;
    };
    const marketIdChainComponent = marketId => {
      const normalized = String(marketId || "").trim().toLowerCase();
      const match = normalized.match(/^(liquidation|dex-arbitrage)-(\d+)-[a-z0-9_-]+$/);
      return match ? match[2] : "";
    };
    const normalizeScopeQuery = query => {
      const normalized = new URLSearchParams(query);
      const chainId = String(normalized.get("chain_id") || "").trim();
      const marketId = String(normalized.get("market_id") || "").trim();
      const marketChainId = marketIdChainComponent(marketId);
      if (chainId && marketChainId && marketChainId !== chainId) {
        normalized.delete("market_id");
        normalized.delete("protocols");
        normalized.delete("protocol_id");
      }
      if (chainId && !normalized.get("market_id")) {
        const fallback = window.__CHAIN_SELECTOR_DEFAULT__ || {};
        const fallbackMarketId = String(fallback.market_id || "").trim();
        const fallbackChainId = marketIdChainComponent(fallbackMarketId);
        if (fallbackChainId && fallbackChainId === chainId) {
          normalized.set("market_id", fallbackMarketId);
        }
      }
      return normalized;
    };
    const apiPath = path => {
      if (path === "/api/dex/overview") {
        const pageUrl = new URL(window.location.href);
        const url = new URL(path, window.location.origin);
        const scopeQuery = window.ChainSelector?.normalizeScopeQuery
          ? window.ChainSelector.normalizeScopeQuery(pageUrl.searchParams)
          : normalizeScopeQuery(pageUrl.searchParams);
        ["chain_id", "market_id", "protocols", "dex_strategy"].forEach(key => {
          const value = scopeQuery.get(key);
          if (value) url.searchParams.set(key, value);
        });
        return url.pathname + (url.search ? url.search : "");
      }
      const scoped = window.ChainSelector?.withSelection ? window.ChainSelector.withSelection(path) : path;
      const url = new URL(scoped, window.location.origin);
      return url.pathname + (url.search ? url.search : "");
    };
    async function fetchJson(path, signal) {
      const response = await fetch(apiPath(path), {cache: "no-cache", signal, headers: {"Accept": "application/json"}});
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `请求失败（HTTP ${response.status}）`);
      return data;
    }
    let marketObservationSourceStage = "computed";
    function pairHtml(pair) {
      const linkage = pair.flashLoanLinkage || {};
      const route = pair.overviewRoute || {};
      const pools = pair.executionPools || pair.preferredPools || [];
      const profit = pair.overviewProfit || {};
      const routeFrameworkSource = pair.routeFrameworkSource || pair.pathSource || "market_observation";
      const routeFrameworkStage = pair.marketObservationSourceStage || marketObservationSourceStage;
      const priceEvidenceSource = pair.priceEvidenceSource || profit.priceEvidenceSource || (profit.requiresLiveQuoter ? "live_quoter_required" : "static_reference_probe");
      const livePriceVerified = Boolean(profit?.priceEvidenceMode === "live_verified" || profit?.livePriceVerified);
      const priceEvidenceText = pair.priceEvidenceSourceLabel || profit.priceEvidenceSourceLabel || priceEvidenceLabel(priceEvidenceSource);
      const routeLabel = "X-Y-Z-X 闭环";
      const routeUsable = pair.routeUsableForObservation;
      const routeUsableText = routeUsable === false
        ? "无可用流动性"
        : routeUsable === true
          ? "可进入报价"
          : "流动性未标注";
      const routeUsableClass = routeUsable === true ? "good" : "warn";
      const rec = profit.recommendation || {};
      const recClass = profit.executableCandidate ? "good" : (profit.requiresLiveQuoter ? "warn" : (profit.profitable ? "warn" : ""));
      const tokenBasis = profit.referenceReturnBasis === "borrow_token";
      const tokenBasisNet = livePriceVerified && tokenBasis ? `${amount(profit.referenceNetProfitAmount, profit.referenceInputSymbol)} / ${num(profit.referenceNetReturnBps, 2)} bps` : "-";
      const tokenBasisLabel = tokenBasis && profit.referenceReturnTrusted === false ? "X 本位参考" : "X 本位收益";
      return `<article class="path">
        <div class="path-head">
          <div>
            <h2>${esc(route.pathText || pair.symbolPair)}</h2>
            <div class="badges">
              <span class="badge good">${esc(frameworkLabel(routeFrameworkSource))}</span>
              <span class="badge">${esc(`观察阶段 ${marketObservationSourceStageLabel(routeFrameworkStage)}`)}</span>
              <span class="badge">${esc(routeLabel)}</span>
              <span class="badge ${routeUsableClass}">${esc(routeUsableText)}</span>
              <span class="badge">路径池 ${esc(pools.length)} / 有流动性 ${esc(pathLiquidPoolCount(pair))}</span>
              <span class="badge">${esc(`价格证据 ${priceEvidenceText}`)}</span>
              <span class="badge ${livePriceVerified ? "good" : "warn"}">${esc(livePriceVerified ? "实时价格已验证" : "实时价格未接入")}</span>
              ${route.kind === "bridge_pair" && (route.bridgeSymbols || []).length ? `<span class="badge warn">中间路径 ${esc((route.bridgeSymbols || []).join(" -> "))}</span>` : ''}
              <span class="badge">锚点 ${esc(route.anchorBorrowSymbol || (linkage.borrow_symbols || []).join(", ") || "-")}</span>
              <span class="badge">目标 ${esc(route.targetSymbol || "-")}</span>
              <span class="badge">候选池 ${esc(pools.length)}</span>
              <span class="badge">每跳候选 ${esc(list(pair.hopCandidates).map(candidate => candidate.poolCount || 0).join(" × "))} / 组合 ${esc(pair.hopCandidateCombinationCount || 1)}</span>
              <span class="badge ${recClass}">${tokenBasis ? tokenBasisLabel : "1000U 净利"} ${esc(tokenBasis ? tokenBasisNet : money(profit.observedNetProfitUsd))}</span>
              ${profit.chainSubmissionCandidate ? '<span class="badge good">链上利润控制候选</span>' : ''}
              ${profit.trustedUsdReference === false ? '<span class="badge warn">USD 锚点不可信</span>' : ''}
              ${profit.tokenDecimalsTrusted === false ? '<span class="badge warn">代币精度待确认（decimals）</span>' : ''}
              ${profit.requiresLiveQuoter ? '<span class="badge warn">需要报价器/SDK 复核（Quoter/SDK）</span>' : ''}
            </div>
          </div>
          <div class="muted">${esc((route.candidatePairSymbols || []).join(" | ") || (linkage.route_symbols || []).join(" -> "))}</div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>探针状态</th><th>毛利</th><th>闪电贷费</th><th>Gas 储备</th><th>净利</th><th>收益 bps</th><th>X 本位净收益</th><th>下一步</th></tr></thead>
          <tbody><tr>
            <td>${esc(profit.complete ? "完成" : "未完成")}</td>
            <td>${livePriceVerified ? money(profit.observedGrossProfitUsd) : "-"}</td>
            <td>${money(profit.flashLoanFeeUsd)}</td>
            <td>${money(profit.gasReserveUsd)}</td>
            <td>${livePriceVerified ? money(profit.observedNetProfitUsd) : "-"}</td>
            <td>${livePriceVerified ? num(profit.observedNetProfitBps, 2) : "-"}</td>
            <td>${esc(tokenBasisNet)}</td>
            <td>${esc(recommendationAction(rec.action || profit.recommendationAction))}</td>
          </tr></tbody>
        </table></div>
        <div class="table-wrap"><table>
          <thead><tr><th>路径池</th><th>协议</th><th>费率</th><th>方向</th><th>TVL</th><th>深度等级</th></tr></thead>
          <tbody>${pools.slice(0, 5).map(pool => `<tr>
            <td>${esc(pool.pool)}</td><td>${esc(pool.dex || pool.protocol || "-")}</td><td>${overviewPoolFeeText(pool)}</td>
            <td>${esc(pool.routeText || (pool.routeSymbols || []).join(" -> ") || "-")}</td>
            <td>${esc((pool.balances || {}).tvlUsd ?? pool.estimatedTvlUsd ?? "-")}</td><td>${overviewPoolLiquidity(pool)}</td>
          </tr>`).join("") || '<tr><td colspan="6">暂无候选池</td></tr>'}</tbody>
        </table></div>
        ${hopCandidateTableHtml(pair.hopCandidates || [], pair.hopCandidateCombinationCount || 1)}
      </article>`;
    }
    function watchHtml(row) {
      const label = row?.symbolPair || row?.pathText || "-";
      const funds = list(row?.associatedFundSymbols).join(", ");
      return `<span class="badge" title="${esc(row?.addressPair || "")}">${esc(label)}${funds ? ` / X=${esc(funds)}` : ""}</span>`;
    }
    function overviewPathGroupKey(path) {
      const route = path?.overviewRoute || {};
      const linkage = path?.flashLoanLinkage || {};
      const borrowSymbols = list(linkage?.borrow_symbols);
      const routeSymbols = list(path?.routeSymbols);
      return String(route?.anchorBorrowSymbol || borrowSymbols[0] || routeSymbols[0] || "-").toUpperCase();
    }
    function buildOverviewGroups(paths) {
      const groups = new Map();
      paths.forEach(path => {
        const key = overviewPathGroupKey(path);
        if (!key || key === "-") return;
        if (!groups.has(key)) groups.set(key, {flashLoanToken: {symbol: key}, startToken: {symbol: key}, endToken: {symbol: key}, paths: [], poolDependencies: []});
        const group = groups.get(key);
        group.paths.push(path);
        list(path?.executionPools || path?.preferredPools).forEach(pool => {
          const id = String(pool?.pool || pool?.poolId || pool?.pairAddress || "").toLowerCase();
          if (id && !group.poolDependencies.some(item => String(item?.pool || item?.poolId || item?.pairAddress || "").toLowerCase() === id)) {
            group.poolDependencies.push(pool);
          }
        });
      });
      return Array.from(groups.values()).sort((left, right) => String(left.flashLoanToken.symbol || "").localeCompare(String(right.flashLoanToken.symbol || "")));
    }
    function renderOverviewGroups(groups) {
      if (!groups.length) return '<div class="empty">当前选择下没有满足闪电贷衔接条件的套利路径。</div>';
      return groups.map(group => {
        const token = group.flashLoanToken || group.startToken || {};
        const poolDeps = list(group.poolDependencies || group.pools);
        const poolHtml = poolDeps.slice(0, 8).map(pool => `<span class="badge" title="${esc(pool?.pool || pool?.pairAddress || "-")}">${esc(pool?.pool || pool?.pairSymbol || pool?.symbolPair || "-")}</span>`).join("") || '<span class="badge">无池明细</span>';
        return `<section class="panel" style="margin-bottom:14px">
          <div class="path-head">
            <div>
              <h2>${esc(token.symbol || "-")} 资金池目录</h2>
              <div class="muted">按可借贷资金 ${esc(token.symbol || "-")} 分组的闭环套利路径</div>
            </div>
            <div class="badges"><span class="badge">${esc(group.paths?.length || 0)} 条路径</span><span class="badge">${esc(poolDeps.length)} 个池</span></div>
          </div>
          <div class="badges">${poolHtml}</div>
          <div>${(group.paths || []).map(pairHtml).join("") || '<div class="empty">暂无路径</div>'}</div>
        </section>`;
      }).join("");
    }
    let refreshGeneration = 0;
    let refreshController = null;
    let renderedScopeSignature = "";
    function requestedScope() {
      const query = window.ChainSelector?.normalizeScopeQuery
        ? window.ChainSelector.normalizeScopeQuery(new URLSearchParams(window.location.search))
        : normalizeScopeQuery(new URLSearchParams(window.location.search));
      const protocols = (query.get("protocols") || "")
        .split(",")
        .map(value => value.trim().toLowerCase())
        .filter(Boolean)
        .sort();
      return {
        chainId: query.get("chain_id") || "",
        protocols,
        signature: `${query.get("chain_id") || ""}|${protocols.join(",")}`,
      };
    }
    function clearOverview() {
      ["pathCount", "watchCount", "profitCount", "bestProfit", "flashCount", "sourceNetwork", "liquidPoolCount"].forEach(id => $(id).textContent = "-");
      ["pathMeta", "watchMeta", "profitMeta", "bestProfitMeta", "flashNames", "sourceMeta", "liquidPoolMeta"].forEach(id => $(id).textContent = "-");
      $("liquidRegistryCount").textContent = "-";
      $("liquidRegistryList").innerHTML = "";
      $("watchList").innerHTML = "";
      $("pathList").innerHTML = "";
    }
    function responseMatchesScope(data, scope) {
      const responseChainId = data?.chain_id ?? data?.poolStaticTable?.chainId ?? data?.poolStaticTable?.chain_id ?? "";
      if (scope.chainId && String(responseChainId) !== String(scope.chainId)) return false;
      const staticChainId = data?.poolStaticTable?.chainId ?? data?.poolStaticTable?.chain_id;
      const flashChainId = data?.flashLoanLiquidity?.chain_id;
      if (staticChainId != null && responseChainId != null && String(staticChainId) !== String(responseChainId)) return false;
      if (flashChainId != null && responseChainId != null && String(flashChainId) !== String(responseChainId)) return false;
      if (scope.protocols.length) {
        const responseProtocols = list(data?.selected_protocols).map(value => String(value).trim().toLowerCase()).filter(Boolean).sort();
        // The backend can narrow a stale multi-protocol URL to this chain's
        // actual DEX protocols (for example mainnet is uniswap_v4 only).
        if (!scope.protocols.some(protocol => responseProtocols.includes(protocol))) return false;
      }
      return true;
    }
    async function refresh(forceRefresh = false) {
      const generation = ++refreshGeneration;
      const scope = requestedScope();
      if (renderedScopeSignature && renderedScopeSignature !== scope.signature) clearOverview();
      renderedScopeSignature = scope.signature;
      if (refreshController) refreshController.abort();
      refreshController = new AbortController();
      $("message").textContent = "正在加载 DEX 总览...";
      try {
        const basePath = apiPath("/api/dex/overview");
        const path = forceRefresh
          ? (basePath.includes("?") ? `${basePath}&refresh=1` : `${basePath}?refresh=1`)
          : basePath;
        const data = await fetchJson(path, refreshController.signal);
        if (generation !== refreshGeneration) return;
        if (!responseMatchesScope(data, scope)) {
          clearOverview();
          $("message").textContent = "接口返回的数据与当前链路不一致";
          return;
        }
        const flash = data.flashLoanLiquidity || {};
        const source = data.poolStaticTable || {};
        marketObservationSourceStage = data.marketObservationSourceStage || data.marketObservationSource || "computed";
        $("pathCount").textContent = data.summary?.arbitragePathCount ?? 0;
        const anchors = data.summary?.closedLoopAnchorSymbols || data.summary?.anchorBorrowSymbols || [];
        $("pathMeta").textContent = `${frameworkLabel(data.summary?.pathSource || "market_observation")} ${data.summary?.overviewPathGroupCount ?? 0} 个资金池 | X-Y-Z-X ${data.summary?.bridgePathCount ?? 0} | 锚点 ${anchors.join(", ") || "-"}`;
        $("watchCount").textContent = data.summary?.watchPairCount ?? 0;
        $("watchMeta").textContent = `链路观察 ${data.summary?.marketObservationRouteCount ?? 0} 条 | 专用交易对 ${data.summary?.chainSpecificObservationPairCount ?? 0}`;
        $("profitCount").textContent = `${data.summary?.overviewProfitableRouteCount ?? 0}/${data.summary?.overviewProbeCompleteCount ?? 0}`;
      $("profitMeta").textContent = `链上候选 ${data.summary?.overviewChainSubmissionCandidateCount ?? 0} | 非U ${data.summary?.overviewNonStableChainSubmissionCandidateCount ?? 0} | 需报价器（Quoter） ${data.summary?.overviewLiveQuoterRequiredCount ?? 0}`;
        $("bestProfit").textContent = money(data.summary?.overviewBestObservedNetProfitUsd);
        $("bestProfitMeta").textContent = `起点 ${num(data.summary?.overviewProbeNotionalUsd ?? 1000, 2)}U | X本位 ${num(data.summary?.overviewBestTokenBasisNetReturnBps, 2)} bps | 可执行 ${money(data.summary?.overviewBestExecutableNetProfitUsd)}`;
        $("flashCount").textContent = (flash.available_protocols || []).length;
        $("flashNames").textContent = (flash.available_protocols || []).join(", ") || "-";
        $("sourceNetwork").textContent = source.network || "-";
        const cacheTime = data.summary?.candidateCacheRefreshedAt || source.generatedAt || source.generated_at || data.generatedAt;
        $("sourceMeta").textContent = source.exists === false
          ? "当前链没有静态池表"
          : `缓存时间 ${cacheTime ? fmtTime(cacheTime) : "-"}`;
        const poolRows = list(data.arbitragePaths || []).flatMap(route => list(route.executionPools || route.preferredPools || route.routePools || []));
        const liquidPoolIds = new Set(poolRows.filter(overviewPoolUsable).map(pool => String(pool.pool || pool.poolId || "").trim().toLowerCase()).filter(Boolean));
        $("liquidPoolCount").textContent = liquidPoolIds.size || "-";
        $("liquidPoolMeta").textContent = `来自 ${poolRows.length} 个路径池`;
        const liquidRegistry = data.liquidPoolRegistry && typeof data.liquidPoolRegistry === "object"
          ? Object.values(data.liquidPoolRegistry)
          : list(data.marketObservation?.liquidPoolRegistry);
        $("liquidRegistryCount").textContent = `${liquidRegistry.length} 个`;
        $("liquidRegistryList").innerHTML = liquidRegistryHtml(liquidRegistry);
        $("watchList").innerHTML = list(data.watchPairs).map(watchHtml).join("") || '<span class="badge">暂无关联 Y-Z 交易对</span>';
        const groups = list(data.arbitragePathGroups || buildOverviewGroups(data.arbitragePaths || []));
        $("pathList").innerHTML = renderOverviewGroups(groups);
        $("message").textContent = "已更新";
      } catch (error) {
        if (generation !== refreshGeneration || error.name === "AbortError") return;
        $("message").textContent = uiError(error.message);
      }
    }
    $("refreshBtn").onclick = refresh;
    $("rebuildBtn").onclick = () => refresh(true);
    window.addEventListener("chainselectionchanged", event => {
      if (String(event?.detail?.selected?.feature || "").toLowerCase() === "dex_arbitrage") refresh();
    });
    window.addEventListener("chainselectionprotocolschanged", () => refresh());
    refresh();
  </script>
</body>
</html>
