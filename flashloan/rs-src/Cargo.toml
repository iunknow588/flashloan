# This crate is built by maturin as a standalone PyO3 project, so it is
# deliberately its own cargo workspace root and cannot join the
# `flashloan/tools` workspace. The machine target is pinned in the
# repository-level `.cargo/config.toml`, which cargo discovers by walking
# up the directory tree, so it applies here exactly as it does to every
# crate in `flashloan/tools`.

# `[workspace]` is declared explicitly for the same reason: without it cargo
# infers an implicit workspace root here, which is fragile once a sibling
# directory introduces a manifest that could be pulled in.
[workspace]

[package]
name = "flashloan-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
# Matches `flashloan/tools` workspace floor. `uniswap-v4-sdk`, which this
# crate reaches through `pool-manager`, requires Rust 1.91 or newer.
rust-version = "1.91"

[lib]
name = "flashloan_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha3 = "0.10"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }
num-bigint = "0.4"
num-traits = "0.2"
manager-contracts = { path = "../tools/manager_contracts" }
broadcast-manager = { path = "../tools/broadcast_manager" }
candidate-edge-pool-manager = { path = "../tools/candidate_edge_pool_manager" }
candidate-exchange-pool-manager = { path = "../tools/candidate_exchange_pool_manager" }
closed-loop-manager = { path = "../tools/closed_loop_manager" }
composite-manager = { path = "../tools/composite_manager" }
pool-manager = { path = "../tools/pool_manager" }
review-manager = { path = "../tools/review_manager" }
token-manager = { path = "../tools/token_manager" }

[dev-dependencies]
manager-db = { path = "../tools/manager_db" }
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3"
